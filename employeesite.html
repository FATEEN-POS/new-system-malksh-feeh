<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة بيانات الموظف - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #050505; 
            --card: #0f0f0f; 
            --accent: #00f2fe; 
            --gray: #1a1a1a; 
            --red: #ff4d4d; 
            --green: #00ff88; 
            --text-gray: #a0a0a0;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: 0.3s; }
        
        body { 
            background: var(--bg); 
            color: #fff; 
            margin: 0; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }

        /* جعل الحاوية تأخذ عرض الشاشة بالكامل */
        .container { 
            width: 100%; 
            max-width: 1400px; 
            margin: 0 auto;
            display: grid; 
            grid-template-columns: 350px 1fr; 
            gap: 25px; 
        }

        .card { 
            background: var(--card); 
            border: 1px solid var(--gray); 
            border-radius: 20px; 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* تحسين قسم الملف الشخصي */
        .profile-side { text-align: center; position: relative; }
        .profile-side::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 120px;
            background: linear-gradient(to bottom, rgba(0, 242, 254, 0.1), transparent);
            border-radius: 20px 20px 0 0;
        }

        .profile-img-container { 
            position: relative; width: 160px; height: 160px; margin: 10px auto 20px; 
            border-radius: 50%; border: 3px solid var(--accent); overflow: hidden; 
            background: #000; box-shadow: 0 0 25px rgba(0, 242, 254, 0.3); z-index: 1;
        }
        .profile-img-container img { width: 100%; height: 100%; object-fit: cover; }

        .upload-btn { 
            display: inline-block; margin-bottom: 25px; font-size: 13px; color: var(--accent); 
            cursor: pointer; border: 1px solid var(--accent); padding: 8px 20px; 
            border-radius: 25px; font-weight: 600;
        }
        .upload-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }
        #file-input { display: none; }

        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; font-size: 13px; color: var(--text-gray); margin-bottom: 8px; font-weight: 600; }
        .input-group input { 
            width: 100%; background: #000; border: 1px solid var(--gray); 
            color: #fff; padding: 14px; border-radius: 12px; font-size: 15px;
        }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 242, 254, 0.1); outline: none; }

        .btn-save { 
            background: var(--accent); color: #000; border: none; padding: 15px; 
            border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; 
            font-size: 16px; margin-top: 10px;
        }
        .btn-save:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4); }

        /* تطوير لوحة الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-box { 
            background: #000; padding: 25px; border-radius: 15px; 
            border-right: 4px solid var(--accent); text-align: center;
        }
        .stat-box span { font-size: 14px; color: var(--text-gray); display: block; margin-bottom: 10px; }
        .stat-box strong { font-size: 28px; color: var(--green); font-weight: 800; }

        /* تطوير قسم التارجت */
        .target-section { background: #000; padding: 25px; border-radius: 15px; border: 1px solid var(--gray); }
        .progress-bar-bg { width: 100%; background: #1a1a1a; height: 18px; border-radius: 10px; margin-top: 15px; overflow: hidden; }
        #progress-fill { 
            width: 0%; height: 100%; 
            background: linear-gradient(to left, var(--accent), var(--green)); 
            box-shadow: 0 0 15px var(--accent);
        }

        /* تحسين الجداول */
        h3 { font-size: 22px; margin-bottom: 20px; color: var(--accent); border-right: 4px solid var(--accent); padding-right: 15px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 10px; }
        th { text-align: right; color: var(--text-gray); padding: 15px; font-size: 14px; }
        td { padding: 18px; background: #000; border-top: 1px solid var(--gray); border-bottom: 1px solid var(--gray); font-size: 15px; }
        td:first-child { border-right: 1px solid var(--gray); border-radius: 0 12px 12px 0; }
        td:last-child { border-left: 1px solid var(--gray); border-radius: 12px 0 0 12px; }

        @media (max-width: 992px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <button onclick="history.back()" style="align-self: flex-start; background: #111; border: 1px solid var(--gray); color: #fff; padding: 10px 25px; border-radius: 12px; cursor: pointer; margin-bottom: 25px; font-weight: 700;">⬅️ عودة للرئيسية</button>
    
    <div class="container">
        <div class="card profile-side">
            <div class="profile-img-container">
                <img id="profile-img" src="https://via.placeholder.com/150" alt="صورة الموظف">
            </div>
            <label for="file-input" class="upload-btn">📸 تحديث الصورة الشخصية</label>
            <input type="file" id="file-input" accept="image/*" onchange="processAndUploadImage()">

            <div class="input-group">
                <label>الاسم الكامل</label>
                <input type="text" id="emp-name" placeholder="الاسم الثلاثي">
            </div>
            <div class="input-group">
                <label>رقم الهاتف</label>
                <input type="text" id="emp-phone">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="emp-pass">
            </div>
            <button class="btn-save" onclick="updateProfile()">✅ حفظ التغييرات</button>
        </div>

        <div class="card">
            <div class="stats-grid">
                <div class="stat-box">
                    <span>💰 إجمالي مبيعاتك</span>
                    <strong id="total-sales-all">0.00</strong>
                </div>
                <div class="stat-box">
                    <span>📊 عدد العمليات</span>
                    <strong id="total-count-all">0</strong>
                </div>
            </div>

            <div class="target-section">
                <div style="display:flex; justify-content:space-between; align-items: center;">
                    <span style="font-weight: 700; font-size: 16px;">🎯 تارجت مبيعات الشهر</span>
                    <span id="target-text" style="color: var(--accent); font-weight: 800;">0 / 0 ج.م</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-fill"></div>
                </div>
            </div>

            <div style="margin-top: 40px;">
                <h3>📜 سجل مبيعاتك الأخير</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>التاريخ</th>
                                <th>رقم العملية</th>
                                <th>المبلغ</th>
                                <th>الوسيلة</th>
                            </tr>
                        </thead>
                        <tbody id="sales-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // الأكواد البرمجية كما هي تماماً لضمان عمل النظام مع قاعدة البيانات
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const storeKey = sessionStorage.getItem('store_key');
        const currentUsername = sessionStorage.getItem('username');

        async function init() {
            if(!currentUsername) return location.href='index.html';
            const { data: emp } = await _supabase.from('users').select('*').eq('username', currentUsername).eq('store_key', storeKey).single();
            if(emp) {
                document.getElementById('emp-name').value = emp.full_name || '';
                document.getElementById('emp-phone').value = emp.phone || '';
                document.getElementById('emp-pass').value = emp.password || '';
                if(emp.image_url) document.getElementById('profile-img').src = emp.image_url;
                loadEmployeeStats(emp.monthly_target || 0);
                loadInitialSales();
            }
        }

        async function processAndUploadImage() {
            const file = document.getElementById('file-input').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const size = 300;
                    canvas.width = size; canvas.height = size;
                    let sX, sY, sW, sH;
                    if (img.width > img.height) { sH = img.height; sW = img.height; sX = (img.width - img.height) / 2; sY = 0; }
                    else { sW = img.width; sH = img.width; sX = 0; sY = (img.height - img.width) / 2; }
                    ctx.drawImage(img, sX, sY, sW, sH, 0, 0, size, size);
                    canvas.toBlob(async (blob) => {
                        const fileName = `${currentUsername}-${Date.now()}.jpg`;
                        const { data, error } = await _supabase.storage.from('avatars').upload(fileName, blob, { contentType: 'image/jpeg' });
                        if (error) return alert("خطأ في الرفع");
                        const { data: urlData } = _supabase.storage.from('avatars').getPublicUrl(fileName);
                        await _supabase.from('users').update({ image_url: urlData.publicUrl }).eq('username', currentUsername).eq('store_key', storeKey);
                        document.getElementById('profile-img').src = urlData.publicUrl;
                        alert("تم تحديث الصورة الشخصية بنجاح! ✅");
                    }, 'image/jpeg', 0.8);
                };
            };
        }

        async function updateProfile() {
            const { error } = await _supabase.from('users').update({
                full_name: document.getElementById('emp-name').value,
                phone: document.getElementById('emp-phone').value,
                password: document.getElementById('emp-pass').value
            }).eq('username', currentUsername).eq('store_key', storeKey);
            if(!error) alert("تم تحديث البيانات بنجاح ✅");
        }

        async function loadEmployeeStats(target) {
            const { data: allSales } = await _supabase.from('sales').select('*').eq('store_key', storeKey).eq('seller_name', currentUsername).eq('type', 'sale');
            let totalVal = 0;
            allSales?.forEach(s => totalVal += s.total_amount);
            document.getElementById('total-sales-all').innerText = totalVal.toLocaleString() + " ج.م";
            document.getElementById('total-count-all').innerText = allSales?.length || 0;
            if(target > 0) {
                let percent = (totalVal / target) * 100;
                if(percent > 100) percent = 100;
                document.getElementById('progress-fill').style.width = percent + "%";
                document.getElementById('target-text').innerText = `${totalVal.toFixed(0)} / ${target} ج.م`;
            }
        }

        async function loadInitialSales() {
            const { data: sales } = await _supabase.from('sales').select('*').eq('store_key', storeKey).eq('seller_name', currentUsername).order('created_at', {ascending: false}).limit(10);
            const body = document.getElementById('sales-body');
            body.innerHTML = sales?.map(s => `<tr><td>${new Date(s.created_at).toLocaleDateString('ar-EG')}</td><td style="color:var(--accent); font-weight:bold;">#${s.id.toString().slice(-5)}</td><td style="font-weight:bold;">${s.total_amount.toFixed(2)} ج.م</td><td>${s.payment_method === 'كاش' ? '💵 كاش' : '💳 فيزا'}</td></tr>`).join('') || '';
        }

        init();
    </script>
</body>
</html>
