<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>كاشير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #050505; --card: #0f0f0f; --accent: #00f2fe; --gray: #1a1a1a; --red: #ff4d4d; --green: #00ff88; --text: #ffffff; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: 0.2s; }
        body { background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- الهيدر المطور --- */
        header {
            background: var(--card); padding: 12px 25px; border-bottom: 1px solid var(--gray);
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
        .store-badge { background: rgba(0, 242, 254, 0.1); padding: 5px 15px; border-radius: 12px; border: 1px solid var(--accent); }
        
        .header-center { flex: 1; display: flex; gap: 10px; max-width: 600px; }
        .header-center input {
            background: #000; border: 1px solid var(--gray); color: #fff; padding: 10px 15px;
            border-radius: 10px; font-size: 14px; width: 100%;
        }
        .header-center input:focus { border-color: var(--accent); outline: none; }

        .header-left { display: flex; align-items: center; gap: 20px; }
        .target-stat { background: #000; padding: 5px 15px; border-radius: 10px; border: 1px solid var(--gray); text-align: center; }
        .target-stat small { font-size: 10px; color: #888; display: block; }
        
        /* --- تقسيم الشاشة --- */
        main { display: flex; flex: 1; overflow: hidden; }
        .products-grid { flex: 1; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; align-content: flex-start; }
        .product-card { background: var(--card); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid var(--gray); cursor: pointer; }
        .product-card:hover { border-color: var(--accent); transform: scale(1.03); }

        .sidebar { width: 400px; background: var(--card); border-right: 1px solid var(--gray); display: flex; flex-direction: column; padding: 15px; }
        .cart-list { flex: 1; overflow-y: auto; }
        
        /* --- أزرار التحكم في السلة --- */
        .cart-item { background: #000; padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #1a1a1a; }
        .cart-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .qty-btn { background: var(--gray); border: none; color: #fff; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .qty-btn:hover { background: var(--accent); color: #000; }
        .del-item { margin-right: auto; color: var(--red); background: none; border: none; cursor: pointer; }

        /* --- ستايل الفاتورة (مطابق للصورة) --- */
        @media print {
            body * { display: none !important; }
            #invoice-print { display: block !important; width: 80mm; background: #fff; color: #000; padding: 5px; font-family: 'Courier New', serif; }
            .inv-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            .inv-table th, .inv-table td { border: 1px solid #000; padding: 4px; text-align: center; font-size: 12px; }
            .inv-header { text-align: center; margin-bottom: 10px; }
        }
        #invoice-print { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <img id="user-img" src="https://via.placeholder.com/50" class="user-avatar">
            <div class="store-badge">
                <span id="store-name" style="font-weight: 800; color: var(--accent);">جاري التحميل...</span>
            </div>
            <div style="cursor:pointer; font-size:20px;" onclick="location.href='employeesite.html'">⚙️</div>
        </div>

        <div class="header-center">
            <input type="text" id="p-search" placeholder="🔍 بحث عن منتج بالاسم أو الباركود..." oninput="loadProducts()">
            <input type="text" id="order-search" placeholder="🔄 رقم الفاتورة للإرجاع..." onkeypress="if(event.key==='Enter') searchOrderForReturn()">
        </div>

        <div class="header-left">
            <div class="target-stat">
                <small>إنجاز التارجت</small>
                <strong id="current-progress" style="color:var(--green)">0</strong> / <span id="monthly-target">0</span>
            </div>
        </div>
    </header>

    <main>
        <div class="products-grid" id="product-list"></div>

        <div class="sidebar">
            <h3 style="margin:0 0 15px 0;">السلة الحالية 🛒</h3>
            <div class="cart-list" id="cart-display"></div>
            
            <div style="border-top: 1px solid var(--gray); padding-top: 15px;">
                <div style="display:flex; justify-content:space-between; font-size:28px; font-weight:900; color:var(--green); margin-bottom:15px;">
                    <span>صافي:</span>
                    <span id="total-price">0.00</span>
                </div>
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <button id="btn-cash" class="qty-btn" style="flex:1; height:45px;" onclick="setPay('كاش')">💵 كاش</button>
                    <button id="btn-visa" class="qty-btn" style="flex:1; height:45px;" onclick="setPay('فيزا')">💳 فيزا</button>
                </div>
                <button onclick="checkout()" style="width:100%; background:var(--accent); color:#000; border:none; padding:15px; border-radius:12px; font-weight:800; font-size:18px; cursor:pointer;">إتمام وطباعة الفاتورة</button>
            </div>
        </div>
    </main>

    <div id="invoice-print" dir="rtl">
        <div class="inv-header">
            <h2 id="inv-store-title" style="margin:0"></h2>
            <div style="display:flex; justify-content:space-between; margin-top:10px;">
                <span>فاتورة رقم: <b id="inv-no"></b></span>
                <span id="inv-date"></span>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <span>الكاتب: <b id="inv-seller"></b></span>
                <span>النوع: مبيعات</span>
            </div>
        </div>
        <table class="inv-table">
            <thead>
                <tr>
                    <th style="width:40%">الصنف</th>
                    <th>الكمية</th>
                    <th>السعر</th>
                    <th>الإجمالي</th>
                </tr>
            </thead>
            <tbody id="inv-body"></tbody>
        </table>
        <div style="margin-top:10px; display:flex; justify-content:flex-end;">
            <div style="border:1px solid #000; padding:5px 20px; font-weight:bold; width:150px; text-align:center;">
                صافي: <span id="inv-total"></span>
            </div>
        </div>
        <center><p style="margin-top:15px; font-size:10px;">شكراً لزيارتكم</p></center>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');
        const currentUser = sessionStorage.getItem('username');
        
        let cart = [];
        let payMethod = 'كاش';

        async function init() {
            const { data: st } = await _supabase.from('stores').select('*').eq('store_key', storeKey).single();
            const { data: user } = await _supabase.from('users').select('*').eq('username', currentUser).eq('store_key', storeKey).single();
            if(st) document.getElementById('store-name').innerText = st.store_name;
            if(user?.image_url) document.getElementById('user-img').src = user.image_url;
            loadProducts();
            updateTargetDisplay();
        }

        async function loadProducts() {
            const s = document.getElementById('p-search').value;
            let query = _supabase.from('products').select('*').eq('store_key', storeKey).gt('stock', 0);
            if(s) query = query.or(`product_name.ilike.%${s}%,barcode.ilike.%${s}%`);
            const { data } = await query;
            document.getElementById('product-list').innerHTML = data.map(p => `
                <div class="product-card" onclick='addToCart(${JSON.stringify(p)})'>
                    <strong>${p.product_name}</strong><br>
                    <span style="color:var(--accent); font-weight:bold;">${p.price} ج.م</span>
                </div>
            `).join('');
        }

        function addToCart(p) {
            const exist = cart.find(i => i.id === p.id);
            if(exist) exist.qty++; else cart.push({...p, qty: 1});
            renderCart();
        }

        function updateQty(idx, amt) {
            cart[idx].qty += amt;
            if(cart[idx].qty <= 0) cart.splice(idx, 1);
            renderCart();
        }

        function renderCart() {
            const display = document.getElementById('cart-display');
            display.innerHTML = cart.map((item, idx) => `
                <div class="cart-item">
                    <div style="display:flex; justify-content:space-between;">
                        <span>${item.product_name}</span>
                        <span>${(item.price * item.qty).toFixed(2)}</span>
                    </div>
                    <div class="cart-controls">
                        <button class="qty-btn" onclick="updateQty(${idx}, -1)">-</button>
                        <span style="font-weight:bold;">${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${idx}, 1)">+</button>
                        <button class="del-item" onclick="cart.splice(${idx},1);renderCart()">✕ حذف</button>
                    </div>
                </div>
            `).join('');
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('total-price').innerText = total.toFixed(2);
        }

        async function checkout() {
            if(cart.length === 0) return;
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            
            const { data: sale } = await _supabase.from('sales').insert([{
                store_key: storeKey, items: cart, total_amount: total, 
                payment_method: payMethod, seller_name: currentUser, type: 'sale'
            }]).select().single();

            for (let item of cart) {
                const { data: p } = await _supabase.from('products').select('stock').eq('id', item.id).single();
                await _supabase.from('products').update({ stock: p.stock - item.qty }).eq('id', item.id);
            }

            // تعبئة الفاتورة للطباعة
            document.getElementById('inv-store-title').innerText = document.getElementById('store-name').innerText;
            document.getElementById('inv-no').innerText = sale.id.toString().slice(-6);
            document.getElementById('inv-date').innerText = new Date().toLocaleString('ar-EG');
            document.getElementById('inv-seller').innerText = currentUser;
            document.getElementById('inv-total').innerText = total.toFixed(0);
            document.getElementById('inv-body').innerHTML = cart.map(i => `
                <tr>
                    <td>${i.product_name}</td>
                    <td>${i.qty}</td>
                    <td>${i.price}</td>
                    <td>${i.price * i.qty}</td>
                </tr>
            `).join('');

            setTimeout(() => { window.print(); cart = []; renderCart(); loadProducts(); updateTargetDisplay(); }, 300);
        }

        async function updateTargetDisplay() {
            const { data: user } = await _supabase.from('users').select('monthly_target').eq('username', currentUser).eq('store_key', storeKey).single();
            document.getElementById('monthly-target').innerText = user?.monthly_target || 0;
            const start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
            const { data: sales } = await _supabase.from('sales').select('total_amount').eq('store_key', storeKey).eq('seller_name', currentUser).eq('type', 'sale').gte('created_at', start.toISOString());
            let sum = 0; sales?.forEach(s => sum += s.total_amount);
            document.getElementById('current-progress').innerText = sum.toFixed(0);
        }

        init();
    </script>
</body>
</html>
