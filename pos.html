<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>كاشير - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #050505; --card: #0f0f0f; --accent: #00f2fe; --gray: #1a1a1a; --red: #ff4d4d; --green: #00ff88; --text: #ffffff; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: 0.2s; }
        body { background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--card); padding: 10px 25px; border-bottom: 1px solid var(--gray); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 30px; }
        .user-info { display: flex; align-items: center; gap: 15px; }

        /* تعديل منطقة البحث لإضافة الشيك بوكس والأقسام */
        .top-controls { background: #0a0a0a; padding: 10px 25px; border-bottom: 1px solid var(--gray); display: flex; flex-direction: column; gap: 10px; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; }
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .cat-btn { background: var(--gray); color: #fff; border: 1px solid #333; padding: 4px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 13px; }
        .cat-btn.active { background: var(--accent); color: #000; font-weight: bold; }
        
        .print-toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--accent); }

        .main-layout { display: grid; grid-template-columns: 1fr 400px; flex: 1; overflow: hidden; }
        .products-section { padding: 20px; overflow-y: auto; }
        .search-box { margin-bottom: 20px; position: relative; }
        .search-box input { width: 100%; background: var(--gray); border: 2px solid #222; color: #fff; padding: 15px; border-radius: 12px; font-size: 18px; outline: none; }
        .search-box input:focus { border-color: var(--accent); }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .p-card { background: var(--card); border: 1px solid var(--gray); border-radius: 15px; padding: 15px; text-align: center; cursor: pointer; position: relative; }
        .p-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .p-card .stock { position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--accent); }

        .cart-section { background: var(--card); border-right: 1px solid var(--gray); display: flex; flex-direction: column; }
        .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
        .cart-item { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; background: var(--gray); padding: 10px; border-radius: 10px; margin-bottom: 10px; align-items: center; }
        
        .cart-summary { background: #000; padding: 20px; border-top: 1px solid var(--gray); }
        .total-row { display: flex; justify-content: space-between; font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 15px; }
        .btn-pay { width: 100%; background: var(--green); color: #000; border: none; padding: 15px; border-radius: 12px; font-size: 20px; font-weight: 800; cursor: pointer; }

        @media print { body * { display: none !important; } #print-area, #print-area * { display: block !important; } }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <h2 id="store-name" style="margin:0; color:var(--accent)">Fateen OS</h2>
            <span id="seller-name" style="color:#888">بائع: ---</span>
        </div>
        <div style="text-align: center; color:var(--green)">تحقيق التارجت: <span id="current-progress">0</span> ج.م</div>
        <button onclick="location.href='manager.html'" style="background:none; border:1px solid #333; color:#fff; padding:5px 15px; border-radius:8px; cursor:pointer;">المدير ⚙️</button>
    </header>

    <div class="top-controls">
        <div class="action-bar">
            <div class="categories" id="cat-list">
                </div>
            <div class="print-toggle">
                <input type="checkbox" id="print-enabled" checked>
                <label for="print-enabled">طباعة فاتورة</label>
            </div>
        </div>
    </div>

    <div class="main-layout">
        <div class="products-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="امسح الباركود أو ابحث عن منتج..." oninput="handleSearch()">
            </div>
            <div class="products-grid" id="products-grid"></div>
        </div>

        <div class="cart-section">
            <div style="padding:15px; border-bottom:1px solid var(--gray); font-weight:bold">السلة</div>
            <div class="cart-items" id="cart-list"></div>
            <div class="cart-summary">
                <div class="total-row"><span>الإجمالي:</span><span id="cart-total">0.00</span></div>
                <button class="btn-pay" onclick="checkout()">إتمام البيع (F8)</button>
            </div>
        </div>
    </div>

    <div id="print-area" style="display:none; color:#000; padding:10px; font-size:12px; width:80mm">
        <center><h2 id="pr-store"></h2><p id="pr-date"></p></center>
        <hr>
        <div id="pr-items"></div>
        <hr>
        <h3 id="pr-total" style="text-align:left"></h3>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');
        const currentUser = sessionStorage.getItem('username');
        
        let allProducts = [];
        let cart = [];

        async function init() {
            if(!storeKey) return location.href='index.html';
            document.getElementById('seller-name').innerText = "بائع: " + currentUser;
            
            // جلب اسم المتجر
            const { data: st } = await _supabase.from('stores').select('store_name').eq('store_key', storeKey).single();
            if(st) document.getElementById('store-name').innerText = st.store_name;

            await loadProducts();
            updateTargetDisplay();
            
            // فوكس تلقائي على البحث
            document.getElementById('search-input').focus();
        }

        async function loadProducts() {
            const { data } = await _supabase.from('products').select('*').eq('store_key', storeKey);
            allProducts = data || [];
            renderCategories();
            renderProducts(allProducts);
        }

        function renderCategories() {
            const cats = ['الكل', ...new Set(allProducts.map(p => p.category || 'عام'))];
            document.getElementById('cat-list').innerHTML = cats.map(c => 
                `<button class="cat-btn ${c==='الكل'?'active':''}" onclick="filterCat('${c}', this)">${c}</button>`
            ).join('');
        }

        function filterCat(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filtered = (cat === 'الكل') ? allProducts : allProducts.filter(p => (p.category || 'عام') === cat);
            renderProducts(filtered);
            document.getElementById('search-input').focus();
        }

        function renderProducts(list) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = list.map(p => `
                <div class="p-card" onclick="addToCart(${p.id})">
                    <span class="stock">مخزن: ${p.stock}</span>
                    <div style="font-weight:bold">${p.product_name}</div>
                    <div style="color:var(--accent); font-weight:800">${p.price} ج.م</div>
                </div>
            `).join('');
        }

        function handleSearch() {
            const term = document.getElementById('search-input').value.trim();
            if(!term) { renderProducts(allProducts); return; }

            // الإضافة الفورية بالباركود
            const p = allProducts.find(x => x.barcode === term);
            if(p) {
                if(p.stock > 0) {
                    addToCart(p.id);
                    document.getElementById('search-input').value = ""; // مسح الخانة فوراً
                } else { alert("المنتج غير متوفر"); document.getElementById('search-input').value = ""; }
                return;
            }

            // البحث العادي بالاسم
            const filtered = allProducts.filter(p => p.product_name.includes(term));
            renderProducts(filtered);
        }

        function addToCart(pid) {
            const p = allProducts.find(x => x.id === pid);
            if(p.stock <= 0) return alert("نفذ المخزن");

            const exist = cart.find(i => i.id === pid);
            if(exist) {
                if(exist.qty < p.stock) exist.qty++;
                else return alert("تجاوزت الكمية المتاحة");
            } else {
                cart.push({ ...p, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            let total = 0;
            list.innerHTML = cart.map((item, idx) => {
                total += (item.price * item.qty);
                return `
                    <div class="cart-item">
                        <div><b>${item.product_name}</b><br><small>${item.price} ج.م</small></div>
                        <div>
                            <button onclick="changeQty(${idx}, -1)" style="background:#333; color:#fff; border:none; padding:2px 8px">-</button>
                            <span style="margin:0 5px">${item.qty}</span>
                            <button onclick="changeQty(${idx}, 1)" style="background:#333; color:#fff; border:none; padding:2px 8px">+</button>
                        </div>
                        <button onclick="cart.splice(${idx},1); updateCartUI()" style="background:none; border:none; color:var(--red); cursor:pointer">🗑️</button>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = total.toFixed(2);
        }

        function changeQty(idx, d) {
            const item = cart[idx];
            const p = allProducts.find(x => x.id === item.id);
            if(d > 0 && item.qty >= p.stock) return;
            item.qty += d;
            if(item.qty <= 0) cart.splice(idx, 1);
            updateCartUI();
        }

        async function checkout() {
            if(cart.length === 0) return;
            const total = parseFloat(document.getElementById('cart-total').innerText);

            // حفظ في الداتا بيز
            const { error } = await _supabase.from('sales').insert([{
                store_key: storeKey,
                seller_name: currentUser,
                items: cart,
                total_amount: total,
                type: 'sale'
            }]);

            if(error) return alert("خطأ في الحفظ");

            // خصم المخزن
            for(let i of cart) {
                await _supabase.from('products').update({ stock: i.stock - i.qty }).eq('id', i.id);
            }

            // فحص الشيك بوكس للطباعة
            if(document.getElementById('print-enabled').checked) {
                doPrint(total);
            }

            cart = [];
            updateCartUI();
            await loadProducts();
            updateTargetDisplay();
            document.getElementById('search-input').focus();
            alert("تم بنجاح ✅");
        }

        function doPrint(total) {
            document.getElementById('pr-store').innerText = document.getElementById('store-name').innerText;
            document.getElementById('pr-date').innerText = new Date().toLocaleString('ar-EG');
            document.getElementById('pr-total').innerText = "الإجمالي: " + total + " ج.م";
            let h = "<table>";
            cart.forEach(i => h += `<tr><td>${i.product_name}</td><td>${i.qty}</td><td>${i.price * i.qty}</td></tr>`);
            document.getElementById('pr-items').innerHTML = h + "</table>";
            window.print();
        }

        async function updateTargetDisplay() {
            const start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
            const { data } = await _supabase.from('sales').select('total_amount').eq('store_key', storeKey).eq('seller_name', currentUser).eq('type', 'sale').gte('created_at', start.toISOString());
            let sum = 0; data?.forEach(s => sum += s.total_amount);
            document.getElementById('current-progress').innerText = sum.toLocaleString();
        }

        window.addEventListener('keydown', e => { if(e.key === 'F8') checkout(); });
        init();
    </script>
</body>
</html>
