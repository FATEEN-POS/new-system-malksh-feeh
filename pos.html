<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>كاشير - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #0f0f0f; --accent: #00f2fe; --gray: #1a1a1a; --red: #ff4d4d; --green: #00ff88; --text: #ffffff; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: 0.2s; }
        body { background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--card); padding: 10px 25px; border-bottom: 1px solid var(--gray); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 30px; }
        
        /* شريط الأقسام والتحكم */
        .controls-bar { display: flex; align-items: center; gap: 20px; background: #111; padding: 10px 25px; border-bottom: 1px solid var(--gray); overflow-x: auto; }
        .print-control { display: flex; align-items: center; gap: 8px; background: var(--gray); padding: 5px 12px; border-radius: 8px; border: 1px solid var(--accent); white-space: nowrap; }
        .categories { display: flex; gap: 10px; }
        .cat-btn { background: var(--gray); color: #fff; border: 1px solid #333; padding: 6px 15px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: 13px; }
        .cat-btn.active { background: var(--accent); color: #000; font-weight: bold; }

        .main-layout { display: grid; grid-template-columns: 1fr 400px; flex: 1; overflow: hidden; }
        
        /* منطقة البحث والمنتجات */
        .products-section { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .search-box { position: relative; }
        .search-box input { width: 100%; background: var(--gray); border: 2px solid #222; color: #fff; padding: 15px 45px; border-radius: 12px; font-size: 18px; outline: none; }
        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,242,254,0.2); }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .p-card { background: var(--card); border: 1px solid var(--gray); border-radius: 15px; padding: 15px; text-align: center; cursor: pointer; position: relative; }
        .p-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .p-card .stock { position: absolute; top: 8px; right: 8px; font-size: 11px; background: rgba(0,0,0,0.6); padding: 2px 7px; border-radius: 5px; color: var(--accent); }
        .p-card.out { opacity: 0.5; cursor: not-allowed; }

        /* منطقة السلة */
        .cart-section { background: var(--card); border-right: 1px solid var(--gray); display: flex; flex-direction: column; }
        .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
        .cart-item { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; background: var(--gray); padding: 10px; border-radius: 10px; margin-bottom: 10px; align-items: center; }
        
        .cart-summary { background: #000; padding: 20px; border-top: 1px solid var(--gray); }
        .total-row { display: flex; justify-content: space-between; font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 15px; }
        .btn-pay { width: 100%; background: var(--green); color: #000; border: none; padding: 15px; border-radius: 12px; font-size: 20px; font-weight: 800; cursor: pointer; }

        @media print { body * { display: none !important; } #print-area, #print-area * { display: block !important; } }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <h2 id="store-name" style="margin:0; color:var(--accent)">Fateen OS</h2>
            <span id="seller-name" style="color:#888">بائع: جاري التحميل...</span>
        </div>
        <div style="text-align: center; color:var(--green)">
            تارجت اليوم المحقق: <span id="current-progress" style="font-weight:bold">0</span> ج.م
        </div>
        <button onclick="location.href='manager.html'" style="background:none; border:1px solid #333; color:#fff; cursor:pointer; padding:5px 15px; border-radius:8px">لوحة الإدارة ⚙️</button>
    </header>

    <div class="controls-bar">
        <div class="print-control">
            <input type="checkbox" id="auto-print" checked>
            <label for="auto-print">طباعة فاتورة</label>
        </div>
        <div class="categories" id="categories-bar">
            </div>
    </div>

    <div class="main-layout">
        <div class="products-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="ابحث بالاسم أو امسح الباركود..." oninput="handleSearch()">
            </div>
            <div class="products-grid" id="products-grid"></div>
        </div>

        <div class="cart-section">
            <div style="padding:15px; border-bottom:1px solid var(--gray); font-weight:bold">سلة المشتريات</div>
            <div class="cart-items" id="cart-list"></div>
            <div class="cart-summary">
                <div class="total-row"><span>الإجمالي:</span><span id="cart-total">0.00</span></div>
                <button class="btn-pay" onclick="checkout()">إتمام البيع (F8)</button>
            </div>
        </div>
    </div>

    <div id="print-area" style="display:none; color:#000; padding:20px; width:80mm; font-size:12px">
        <center>
            <h2 id="pr-store-name"></h2>
            <p id="pr-date"></p>
            <hr>
        </center>
        <div id="pr-items"></div>
        <hr>
        <h3 id="pr-total" style="text-align:left"></h3>
        <center><p>شكراً لزيارتكم</p></center>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const storeKey = sessionStorage.getItem('store_key');
        const currentUser = sessionStorage.getItem('username');
        let allProducts = [];
        let cart = [];

        async function init() {
            if(!storeKey) return location.href='index.html';
            document.getElementById('seller-name').innerText = "بائع: " + currentUser;
            
            const { data: st } = await _supabase.from('stores').select('store_name').eq('store_key', storeKey).single();
            if(st) document.getElementById('store-name').innerText = st.store_name;

            await loadProducts();
            updateTargetDisplay();
            
            // الفوكس التلقائي على البحث عند فتح الصفحة
            document.getElementById('search-input').focus();
        }

        async function loadProducts() {
            const { data } = await _supabase.from('products').select('*').eq('store_key', storeKey);
            allProducts = data || [];
            renderCategories();
            renderProducts(allProducts);
        }

        function renderCategories() {
            const cats = ['الكل', ...new Set(allProducts.map(p => p.category || 'عام'))];
            document.getElementById('categories-bar').innerHTML = cats.map(c => 
                `<button class="cat-btn ${c==='الكل'?'active':''}" onclick="filterByCat('${c}', this)">${c}</button>`
            ).join('');
        }

        function filterByCat(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filtered = cat === 'الكل' ? allProducts : allProducts.filter(p => (p.category || 'عام') === cat);
            renderProducts(filtered);
            document.getElementById('search-input').focus();
        }

        function renderProducts(list) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = list.map(p => `
                <div class="p-card ${p.stock <= 0 ? 'out' : ''}" onclick="addToCart(${p.id})">
                    <span class="stock">مخزن: ${p.stock}</span>
                    <div style="font-weight:bold; margin-bottom:5px;">${p.product_name}</div>
                    <div style="color:var(--accent); font-weight:800;">${p.price} ج.م</div>
                </div>
            `).join('');
        }

        // معالجة البحث + الإضافة الفورية بالباركود
        function handleSearch() {
            const term = document.getElementById('search-input').value.trim();
            if(!term) { renderProducts(allProducts); return; }

            // فحص إذا كان الباركود مطابق تماماً لمنتج
            const exactProduct = allProducts.find(p => p.barcode === term);
            if(exactProduct) {
                if(exactProduct.stock > 0) {
                    addToCart(exactProduct.id);
                    document.getElementById('search-input').value = ""; // تفريغ الخانة فوراً
                } else {
                    alert("عفواً، الصنف نفذ من المخزن");
                    document.getElementById('search-input').value = "";
                }
                return;
            }

            // فلترة عادية بالاسم لو مفيش تطابق باركود
            const filtered = allProducts.filter(p => p.product_name.includes(term));
            renderProducts(filtered);
        }

        function addToCart(pid) {
            const p = allProducts.find(x => x.id === pid);
            if(p.stock <= 0) return;

            const existing = cart.find(item => item.id === pid);
            if(existing) {
                if(existing.qty < p.stock) existing.qty++;
                else alert("لا يوجد كمية كافية بالمخزن");
            } else {
                cart.push({ ...p, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            let total = 0;
            list.innerHTML = cart.map((item, index) => {
                total += (item.price * item.qty);
                return `
                    <div class="cart-item">
                        <div><b>${item.product_name}</b><br><small>${item.price} ج.م</small></div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <button onclick="changeQty(${index}, -1)" style="background:#333; border:none; color:#fff; width:25px; cursor:pointer">-</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty(${index}, 1)" style="background:#333; border:none; color:#fff; width:25px; cursor:pointer">+</button>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:none; border:none; color:var(--red); cursor:pointer">🗑️</button>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = total.toFixed(2);
        }

        function changeQty(idx, delta) {
            const item = cart[idx];
            const p = allProducts.find(x => x.id === item.id);
            if(delta > 0 && item.qty >= p.stock) return alert("نفذت الكمية");
            item.qty += delta;
            if(item.qty <= 0) cart.splice(idx, 1);
            updateCartUI();
        }

        function removeFromCart(idx) { cart.splice(idx, 1); updateCartUI(); }

        async function checkout() {
            if(cart.length === 0) return;
            const total = parseFloat(document.getElementById('cart-total').innerText);
            
            // 1. تسجيل العملية في الداتا بيز
            const { data: sale, error } = await _supabase.from('sales').insert([{
                store_key: storeKey,
                seller_name: currentUser,
                items: cart,
                total_amount: total,
                type: 'sale'
            }]).select();

            if(error) return alert("فشل حفظ العملية: " + error.message);

            // 2. تحديث المخزون
            for(let item of cart) {
                const newStock = item.stock - item.qty;
                await _supabase.from('products').update({ stock: newStock }).eq('id', item.id);
            }

            // 3. فحص هل يطبع فاتورة أم لا
            if(document.getElementById('auto-print').checked) {
                printReceipt(total);
            }

            // 4. إعادة التهيئة
            cart = [];
            updateCartUI();
            await loadProducts();
            updateTargetDisplay();
            document.getElementById('search-input').focus();
            alert("تمت العملية بنجاح ✅");
        }

        function printReceipt(total) {
            const prArea = document.getElementById('print-area');
            document.getElementById('pr-store-name').innerText = document.getElementById('store-name').innerText;
            document.getElementById('pr-date').innerText = new Date().toLocaleString('ar-EG');
            document.getElementById('pr-total').innerText = "الإجمالي: " + total + " ج.م";
            
            let itemsHtml = "<table><tr style='border-bottom:1px solid #000'><th>الصنف</th><th>الكمية</th><th>السعر</th></tr>";
            cart.forEach(i => {
                itemsHtml += `<tr><td>${i.product_name}</td><td>${i.qty}</td><td>${i.price * i.qty}</td></tr>`;
            });
            itemsHtml += "</table>";
            document.getElementById('pr-items').innerHTML = itemsHtml;

            window.print();
        }

        async function updateTargetDisplay() {
            const start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
            const { data } = await _supabase.from('sales').select('total_amount').eq('store_key', storeKey).eq('seller_name', currentUser).gte('created_at', start.toISOString());
            let total = 0; data?.forEach(s => total += s.total_amount);
            document.getElementById('current-progress').innerText = total.toLocaleString();
        }

        // اختصارات الكيبورد (F8 لاتمام البيع)
        window.addEventListener('keydown', (e) => {
            if(e.key === 'F8') { e.preventDefault(); checkout(); }
        });

        init();
    </script>
</body>
</html>
