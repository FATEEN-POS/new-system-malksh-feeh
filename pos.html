<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Fateen OS | POS Cashier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #000; --card: #111; --accent: #00f2fe; --gray: #222; --red: #ff4d4d; --green: #00ff88; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .products-section { flex: 2; padding: 20px; border-left: 1px solid var(--gray); display: flex; flex-direction: column; }
        .cart-section { flex: 1; background: var(--card); padding: 20px; display: flex; flex-direction: column; }
        
        .pos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; overflow-y: auto; flex-grow: 1; }
        
        .product-card { background: #080808; border: 1px solid var(--gray); padding: 15px; border-radius: 12px; cursor: pointer; text-align: center; }
        .product-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .product-card h4 { margin: 10px 0 5px; font-size: 14px; }
        .product-card span { color: var(--accent); font-weight: bold; }

        .search-input { width: 100%; background: var(--card); border: 1px solid var(--gray); color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 20px; }

        .cart-list { flex-grow: 1; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #1a1a1a; font-size: 14px; }
        
        .total-box { padding: 20px 0; border-top: 2px solid var(--gray); }
        .total-box h2 { margin: 0; display: flex; justify-content: space-between; }
        
        .checkout-btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 15px; }
        .checkout-btn:hover { background: #00d8e4; }

        .print-receipt { display: none; }
        @media print {
            body * { display: none; }
            .print-receipt { display: block; color: #000; padding: 20px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="products-section">
        <div class="pos-header">
            <h2 id="store-name">تحميل...</h2>
            <input type="text" id="search" class="search-input" placeholder="ابحث عن صنف أو باركود..." oninput="renderProducts()">
        </div>
        <div class="product-grid" id="product-list"></div>
    </div>

    <div class="cart-section">
        <h3>سلة البيع</h3>
        <div class="cart-list" id="cart-list"></div>
        <div class="total-box">
            <h2><span>الإجمالي:</span> <span id="total-val">0</span></h2>
            <button class="checkout-btn" onclick="checkout('نقدي')">💵 دفع كاش</button>
            <button class="checkout-btn" style="background: var(--green);" onclick="checkout('فيزا')">💳 دفع فيزا</button>
            <button class="checkout-btn" style="background: var(--red); font-size: 14px; margin-top: 10px;" onclick="cart=[]; renderCart();">❌ مسح السلة</button>
        </div>
    </div>

    <div class="print-receipt" id="receipt">
        <center>
            <h2 id="r-store">اسم المحل</h2>
            <p id="r-date"></p>
        </center>
        <hr>
        <div id="r-items"></div>
        <hr>
        <h3 id="r-total"></h3>
        <center><p>شكراً لزيارتكم</p></center>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');

        let products = [];
        let cart = [];

        async function loadProducts() {
            const { data } = await _supabase.from('products').select('*').eq('store_key', storeKey);
            products = data || [];
            renderProducts();
        }

        function renderProducts() {
            const query = document.getElementById('search').value.toLowerCase();
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            
            products.filter(p => p.product_name.toLowerCase().includes(query) || p.barcode?.includes(query)).forEach(p => {
                list.innerHTML += `
                    <div class="product-card" onclick="addToCart(${p.id})">
                        <h4>${p.product_name}</h4>
                        <span>${p.price} ج.م</span>
                        <div style="font-size:10px; color:#555">مخزن: ${p.stock}</div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            const exist = cart.find(x => x.id === id);
            if(exist) exist.qty++;
            else cart.push({ ...p, qty: 1 });
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += (item.price * item.qty);
                list.innerHTML += `
                    <div class="cart-item">
                        <div>${item.product_name} x ${item.qty}</div>
                        <div>${item.price * item.qty} ج.م</div>
                    </div>
                `;
            });
            document.getElementById('total-val').innerText = total;
        }

        async function checkout(paymentMethod) {
            if(cart.length === 0) return alert("السلة فارغة");
            const total = parseFloat(document.getElementById('total-val').innerText);

            // --- التعديل المطلوب: سحب اسم الموظف من الـ Session ---
            const currentUser = sessionStorage.getItem('username') || 'موظف غير معروف';

            // 1. تسجيل العملية في الداتا بيز مع إضافة حقل seller_name
            const { data: sale, error } = await _supabase.from('sales').insert([{
                store_key: storeKey,
                items: cart,
                total_amount: total,
                payment_method: paymentMethod,
                seller_name: currentUser, // الحقل الجديد المربوط بالموظف
                type: 'sale',
                created_at: new Date()
            }]);

            if (error) {
                console.error("خطأ في تسجيل العملية:", error);
                return alert("حدث خطأ أثناء الحفظ");
            }

            // 2. خصم المخزن
            for (let item of cart) {
                const { data: p } = await _supabase.from('products').select('stock').eq('id', item.id).single();
                if (p) {
                    await _supabase.from('products').update({ stock: p.stock - item.qty }).eq('id', item.id);
                }
            }

            // 3. الطباعة والمعاينة
            document.getElementById('r-store').innerText = document.getElementById('store-name').innerText;
            document.getElementById('r-date').innerText = new Date().toLocaleString('ar-EG');
            document.getElementById('r-items').innerHTML = cart.map(i => `<div>${i.product_name} (${i.qty}) .. ${i.price * i.qty} ج.م</div>`).join('');
            document.getElementById('r-total').innerText = "الإجمالي: " + total + " ج.م (" + paymentMethod + ")";
            
            window.print();
            cart = [];
            renderCart();
            loadProducts();
            alert("تمت العملية بنجاح بواسطة: " + currentUser);
        }

        async function init() {
            if(!storeKey) return location.href='index.html';
            const { data: st } = await _supabase.from('stores').select('store_name').eq('store_key', storeKey).single();
            document.getElementById('store-name').innerText = st?.store_name || "Fateen OS";
            loadProducts();
        }
        init();
    </script>
</body>
</html>
