<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدار OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #050505; --card: #111111; --accent: #00f2fe; --white: #ffffff; --gray: #222; --red: #ff4d4d; --green: #00ff88; --orange: #ffa500; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; transition: 0.3s; }
        body { background: var(--bg); color: var(--white); margin: 0; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--card); border-radius: 15px; border: 1px solid var(--gray); margin-bottom: 20px; }
        .version-tag { background: rgba(0, 242, 254, 0.1); color: var(--accent); padding: 4px 12px; border-radius: 8px; font-size: 12px; border: 1px solid var(--accent); font-weight: bold; }
        .feedback-tag { color: var(--green); font-size: 14px; font-weight: bold; margin-right: 10px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border: 1px solid var(--gray); padding: 25px; border-radius: 20px; text-align: center; }
        .stat-card p { font-size: 32px; font-weight: bold; margin: 10px 0 0 0; color: var(--accent); }

        .chart-container { background: var(--card); border: 1px solid var(--gray); padding: 20px; border-radius: 20px; margin-bottom: 30px; height: 300px; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 15px; border-bottom: 1px solid var(--gray); padding-bottom: 10px; }
        .section-title { font-size: 18px; color: var(--accent); }
        
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid var(--gray); margin-bottom: 20px; }
        th { background: #1a1a1a; padding: 12px; text-align: right; color: var(--accent); font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid var(--gray); font-size: 13px; }

        .btn { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-add { background: var(--accent); color: #000; }
        .btn-del { background: var(--red); color: #fff; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--accent); width: 450px; }
        input { width: 100%; background: #000; border: 1px solid var(--gray); color: #fff; padding: 10px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="cursor: pointer; font-size: 24px;" onclick="location.href='3dadat.html'">⚙️</div>
            <h2 id="display-store-name" style="margin:0">لوحة التحكم</h2>
            <div class="version-tag" id="sys-version">Loading...</div>
            <div class="feedback-tag" id="store-feedback"></div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn" style="background:var(--orange)" onclick="location.href='about.html'">📞 تواصل معنا</button>
            <button class="btn btn-del" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>إجمالي مبيعات اليوم</h3><p id="total-sales">0.00</p></div>
        <div class="stat-card"><h3>عدد العمليات</h3><p id="today-count">0</p></div>
    </div>

    <div class="chart-container"><canvas id="salesChart"></canvas></div>

    <div class="section-header">
        <h3 class="section-title">⚠️ نواقص المخزن</h3>
    </div>
    <table id="shortage-table">
        <thead><tr><th>الصنف</th><th>الكمية</th><th>حد التنبيه</th></tr></thead>
        <tbody id="shortage-list"></tbody>
    </table>

    <div class="section-header">
        <h3 class="section-title">🕒 مبيعات اليوم بالتفصيل</h3>
        <input type="text" id="sales-search" placeholder="🔍 بحث برقم الفاتورة..." oninput="filterSales()" style="width:200px; margin:0">
    </div>
    <table>
        <thead><tr><th>رقم الفاتورة</th><th>الوقت</th><th>البائع</th><th>المبلغ</th></tr></thead>
        <tbody id="today-sales-table"></tbody>
    </table>

    <div class="section-header">
        <h3 class="section-title">👥 إدارة الفريق</h3>
        <button class="btn btn-add" onclick="openUserModal()">+ إضافة موظف</button>
    </div>
    <table>
        <thead><tr><th>الموظف</th><th>مبيعات الشهر</th><th>التارجت</th><th>الإجراءات</th></tr></thead>
        <tbody id="users-list"></tbody>
    </table>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3 id="user-modal-title" style="color: var(--accent);">إضافة موظف جديد</h3>
            <input type="hidden" id="edit-user-id">
            <input type="text" id="u-name" placeholder="اسم المستخدم">
            <input type="text" id="u-phone" placeholder="رقم الهاتف">
            <input type="number" id="u-target" placeholder="التارجت الشهري">
            <input type="text" id="u-img" placeholder="رابط صورة الموظف">
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn btn-add" style="flex:1" onclick="saveUser()">حفظ</button>
                <button class="btn" style="flex:1; background:var(--gray); color:#fff" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');
        let allTodaySales = [];
        let salesChart;

        async function init() {
            if(!storeKey) return location.href='index.html';
            loadSystemSettings();
            loadDashboard();
            loadShortages();
            loadUsers();
        }

        async function loadSystemSettings() {
            const { data: ver } = await _supabase.from('system_settings').select('value').eq('key', 'sys_version').single();
            if(ver) document.getElementById('sys-version').innerText = ver.value;
            
            const { data: store } = await _supabase.from('stores').select('feedback').eq('store_key', storeKey).single();
            if(store?.feedback) document.getElementById('store-feedback').innerText = "⭐ Feedback: " + store.feedback;
        }

        async function loadDashboard() {
            const today = new Date().toISOString().split('T')[0];
            const { data: sales } = await _supabase.from('sales').select('*').eq('store_key', storeKey).gte('created_at', today);
            allTodaySales = sales || [];
            
            let total = 0;
            let hourly = Array(24).fill(0);
            allTodaySales.forEach(s => {
                total += s.total_amount;
                hourly[new Date(s.created_at).getHours()] += s.total_amount;
            });

            document.getElementById('total-sales').innerText = total.toLocaleString() + " ج.م";
            document.getElementById('today-count').innerText = allTodaySales.length;
            renderSalesTable(allTodaySales);
            renderChart(hourly);
        }

        function renderChart(data) {
            const ctx = document.getElementById('salesChart').getContext('2d');
            if(salesChart) salesChart.destroy();
            salesChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => i + ":00"),
                    datasets: [{ label: 'المبيعات', data: data, borderColor: '#00f2fe', tension: 0.4, fill: true, backgroundColor: 'rgba(0,242,254,0.1)' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        async function loadShortages() {
            const { data } = await _supabase.from('products').select('*').eq('store_key', storeKey);
            document.getElementById('shortage-list').innerHTML = data?.filter(p => p.stock <= (p.alert_limit || 5)).map(p => `
                <tr><td>${p.product_name}</td><td style="color:var(--red)">${p.stock}</td><td>${p.alert_limit || 5}</td></tr>
            `).join('') || '';
        }

        async function loadUsers() {
            const { data: users } = await _supabase.from('users').select('*').eq('store_key', storeKey).eq('role', 'staff');
            document.getElementById('users-list').innerHTML = users?.map(u => `
                <tr>
                    <td>${u.username}</td>
                    <td>${u.monthly_sales || 0} ج.م</td>
                    <td>${u.monthly_target || 0}</td>
                    <td>
                        <button class="btn btn-add" onclick="editUser('${u.username}')">📝</button>
                        <button class="btn btn-del" onclick="deleteUser('${u.username}')">🗑️</button>
                    </td>
                </tr>
            `).join('') || '';
        }

        async function saveUser() {
            const editId = document.getElementById('edit-user-id').value;
            const userData = {
                username: document.getElementById('u-name').value,
                phone: document.getElementById('u-phone').value,
                monthly_target: parseInt(document.getElementById('u-target').value) || 0,
                image_url: document.getElementById('u-img').value,
                role: 'staff',
                store_key: storeKey
            };
            if(editId) await _supabase.from('users').update(userData).eq('username', editId);
            else await _supabase.from('users').insert([userData]);
            closeModal(); loadUsers();
        }

        async function deleteUser(username) {
            if(confirm("حذف الموظف نهائياً؟")) {
                await _supabase.from('users').delete().eq('username', username);
                loadUsers();
            }
        }

        function renderSalesTable(data) {
            document.getElementById('today-sales-table').innerHTML = data.map(s => `
                <tr>
                    <td>#${s.id}</td>
                    <td>${new Date(s.created_at).toLocaleTimeString('ar-EG')}</td>
                    <td>${s.seller_name || '---'}</td>
                    <td>${s.total_amount} ج.م</td>
                </tr>
            `).join('');
        }

        function filterSales() {
            const term = document.getElementById('sales-search').value;
            renderSalesTable(allTodaySales.filter(s => s.id.toString().includes(term)));
        }

        function openUserModal() { document.getElementById('edit-user-id').value = ""; document.getElementById('userModal').style.display='flex'; }
        function closeModal() { document.getElementById('userModal').style.display='none'; }
        function logout() { sessionStorage.clear(); location.replace('index.html'); }
        init();
    </script>
</body>
</html>
