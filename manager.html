<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تمام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #050505; --card: #111111; --accent: #00f2fe; --white: #ffffff; --gray: #222; --red: #ff4d4d; --green: #00ff88; --orange: #ffa500; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; transition: 0.3s; }
        body { background: var(--bg); color: var(--white); margin: 0; padding: 20px; overflow-x: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--card); border-radius: 15px; border: 1px solid var(--gray); margin-bottom: 20px; }
        .store-info { display: flex; align-items: center; gap: 15px; }
        .version-tag { background: rgba(0, 242, 254, 0.1); color: var(--accent); padding: 4px 12px; border-radius: 8px; font-size: 12px; border: 1px solid var(--accent); font-weight: bold; }

        .settings-gear { cursor: pointer; font-size: 24px; color: var(--accent); margin-left: 10px; display: flex; align-items: center; justify-content: center; }
        .settings-gear:hover { transform: rotate(90deg); color: var(--white); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); border: 1px solid var(--gray); padding: 25px; border-radius: 20px; text-align: center; }
        .stat-card h3 { font-size: 14px; color: #888; margin: 0; }
        .stat-card p { font-size: 32px; font-weight: bold; margin: 10px 0 0 0; color: var(--accent); }

        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .nav-item { background: var(--card); border: 1px solid var(--gray); padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; text-decoration: none; color: #fff; border: 1px solid transparent; }
        .nav-item:hover { border-color: var(--accent); transform: translateY(-5px); background: rgba(0, 242, 254, 0.05); }

        .section-title { font-size: 18px; margin: 20px 0 15px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray); padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid var(--gray); margin-bottom: 20px; }
        th { background: #1a1a1a; padding: 12px; text-align: right; color: var(--accent); font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid var(--gray); font-size: 13px; }

        .btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; }
        .btn-add { background: var(--accent); color: #000; }
        .btn-del { background: var(--red); color: #fff; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--accent); width: 400px; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-bottom: 10px; background: #000; border: 1px solid var(--gray); color: #fff; border-radius: 8px; }

        .emp-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-left: 10px; border: 1px solid var(--accent); cursor: pointer; }
        .emp-img:hover { filter: brightness(1.2); border-width: 2px; }
        .target-input { width: 80px; background: #000; border: 1px solid var(--gray); color: var(--green); padding: 4px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>

    <input type="file" id="admin-file-input" accept="image/*" style="display: none;">

    <div class="header">
        <div class="store-info">
            <div class="settings-gear" onclick="location.href='3dadat.html'">⚙️</div>
            <h2 id="display-store-name" style="margin:0">جاري التحميل...</h2>
            <div class="version-tag" id="display-sys-v">V 0.0.0</div>
        </div>
        <button class="btn btn-del" onclick="logout()">تسجيل خروج</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3> إجمالي المبيعات (الكل)</h3>
            <p id="total-sales">0.00</p>
        </div>
        <div class="stat-card">
            <h3> عدد فواتير اليوم</h3>
            <p id="today-count">0</p>
        </div>
    </div>

    <div class="nav-grid">
        <div class="nav-item" onclick="location.href='inventory.html'"> المخزن والطلبيات</div>
        <div class="nav-item" onclick="location.href='pos.html'"> شاشة الكاشير</div>
        <div class="nav-item" onclick="location.href='reports.html'"> مركز التقارير</div>
    </div>

    <div class="section-title"> مبيعات اليوم بالتفصيل</div>
    <table>
        <thead>
            <tr>
                <th>رقم العملية</th>
                <th>الوقت</th>
                <th>الإجمالي</th>
                <th>الحالة</th>
                <th>إجراءات</th>
            </tr>
        </thead>
        <tbody id="today-sales-table"></tbody>
    </table>

    <div class="section-title">
        👥 إدارة فريق العمل
        <button class="btn btn-add" onclick="openUserModal()">+ إضافة موظف</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>الموظف</th>
                <th>الصلاحية</th>
                <th>التارجت الشهري</th>
                <th>الهاتف</th>
                <th>إجراءات</th>
            </tr>
        </thead>
        <tbody id="users-list"></tbody>
    </table>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3>إضافة مستخدم جديد</h3>
            <input type="text" id="u-username" placeholder="اسم المستخدم">
            <input type="password" id="u-password" placeholder="كلمة المرور">
            <input type="text" id="u-phone" placeholder="رقم الهاتف">
            <select id="u-role">
                <option value="employee">موظف (كاشير)</option>
                <option value="manager">مدير (صلاحية كاملة)</option>
            </select>
            <button class="btn btn-add" style="width:100%" onclick="saveUser()">حفظ</button>
            <button class="btn" style="width:100%; background:none; color:#888; margin-top:10px" onclick="closeUserModal()">إلغاء</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const storeKey = sessionStorage.getItem('store_key');
        let currentTargetUser = ""; // لحفظ اسم المستخدم الذي نعدل صورته حالياً

        async function checkAuth() {
            if(!storeKey) { window.location.replace('index.html'); return; }
            init();
        }

        async function init() {
            const { data: store } = await _supabase.from('stores').select('*').eq('store_key', storeKey).single();
            const { data: vData } = await _supabase.from('system_settings').select('value').eq('key', 'sys_version').single();
            if(store) document.getElementById('display-store-name').innerText = "متجر " + store.store_name;
            if(vData) document.getElementById('display-sys-v').innerText = "إصدار " + vData.value;
            loadSalesData();
            loadUsers();
        }

        async function loadSalesData() {
            const today = new Date().toISOString().split('T')[0];
            const { data: allSales } = await _supabase.from('sales').select('total_amount').eq('store_key', storeKey).eq('type', 'sale');
            let total = 0;
            allSales?.forEach(s => total += s.total_amount);
            document.getElementById('total-sales').innerText = total.toLocaleString() + " ج.م";
            const { data: todaySales } = await _supabase.from('sales').select('*').eq('store_key', storeKey).gte('created_at', today + 'T00:00:00').order('created_at', { ascending: false });
            document.getElementById('today-count').innerText = todaySales?.length || 0;
            const tableBody = document.getElementById('today-sales-table');
            tableBody.innerHTML = todaySales?.map(sale => `
                <tr>
                    <td>#${sale.id.toString().slice(-6)}</td>
                    <td>${new Date(sale.created_at).toLocaleTimeString('ar-EG')}</td>
                    <td style="font-weight:bold; color:var(--green)">${sale.total_amount} ج.م</td>
                    <td>${sale.type === 'sale' ? 'مكتملة' : 'مرتجع'}</td>
                    <td><button class="btn btn-del" onclick="returnSale('${sale.id}')">إرجاع</button></td>
                </tr>
            `).join('') || '';
        }

        async function loadUsers() {
            const { data: users } = await _supabase.from('users').select('*').eq('store_key', storeKey);
            const list = document.getElementById('users-list');
            list.innerHTML = users?.map(u => {
                const userImg = u.image_url || 'https://via.placeholder.com/40';
                return `
                    <tr>
                        <td>
                            <img src="${userImg}" class="emp-img" title="اضغط لتغيير الصورة" onclick="triggerImageUpload('${u.username}')" onerror="this.src='https://via.placeholder.com/40'">
                            ${u.username}
                        </td>
                        <td>${u.role === 'manager' ? 'مدير' : 'موظف'}</td>
                        <td><input type="number" class="target-input" value="${u.monthly_target || 0}" onchange="updateTarget('${u.username}', this.value)"> ج.م</td>
                        <td>${u.phone || '---'}</td>
                        <td>
                            <button class="btn" style="background:var(--orange)" onclick="changePass('${u.username}')">كلمة السر</button>
                            <button class="btn btn-del" onclick="deleteUser('${u.username}')">حذف</button>
                        </td>
                    </tr>
                `;
            }).join('') || '';
        }

        // --- دوال تعديل الصورة الجديدة للمدير ---

        function triggerImageUpload(username) {
            currentTargetUser = username;
            document.getElementById('admin-file-input').click();
        }

        document.getElementById('admin-file-input').onchange = async function(e) {
            const file = e.target.files[0];
            if (!file || !currentTargetUser) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const size = 300; 
                    canvas.width = size; canvas.height = size;

                    // القص الذكي في المنتصف
                    let sX, sY, sW, sH;
                    if (img.width > img.height) { sH = img.height; sW = img.height; sX = (img.width - img.height) / 2; sY = 0; }
                    else { sW = img.width; sH = img.width; sX = 0; sY = (img.height - img.width) / 2; }

                    ctx.drawImage(img, sX, sY, sW, sH, 0, 0, size, size);

                    canvas.toBlob(async (blob) => {
                        const fileName = `admin-mod-${currentTargetUser}-${Date.now()}.jpg`;
                        const { data, error } = await _supabase.storage.from('avatars').upload(fileName, blob);

                        if (error) return alert("خطأ في الرفع: تأكد من وجود Bucket باسم avatars");

                        const { data: urlData } = _supabase.storage.from('avatars').getPublicUrl(fileName);
                        const publicUrl = urlData.publicUrl;

                        await _supabase.from('users').update({ image_url: publicUrl }).eq('username', currentTargetUser).eq('store_key', storeKey);
                        
                        alert("تم تحديث صورة " + currentTargetUser + " بنجاح ✅");
                        loadUsers();
                    }, 'image/jpeg', 0.8);
                };
            };
        };

        // --- باقي الدوال الأصلية ---

        async function updateTarget(username, val) {
            await _supabase.from('users').update({ monthly_target: parseFloat(val) }).eq('username', username).eq('store_key', storeKey);
        }

        function openUserModal() { document.getElementById('userModal').style.display = 'flex'; }
        function closeUserModal() { document.getElementById('userModal').style.display = 'none'; }

        async function saveUser() {
            const u = document.getElementById('u-username').value;
            const p = document.getElementById('u-password').value;
            const ph = document.getElementById('u-phone').value;
            const r = document.getElementById('u-role').value;
            if(!u || !p) return alert("أكمل البيانات");
            await _supabase.from('users').insert([{ username: u, password: p, phone: ph, role: r, store_key: storeKey, monthly_target: 0 }]);
            closeUserModal(); loadUsers();
        }

        async function changePass(username) {
            const newPass = prompt("أدخل كلمة المرور الجديدة:");
            if(newPass) await _supabase.from('users').update({ password: newPass }).eq('username', username);
        }

        async function deleteUser(username) {
            if(confirm("حذف المستخدم؟")) { await _supabase.from('users').delete().eq('username', username); loadUsers(); }
        }

        async function returnSale(saleId) {
            if(!confirm("إرجاع الفاتورة؟")) return;
            const { data: sale } = await _supabase.from('sales').select('*').eq('id', saleId).single();
            if(sale) {
                for (let item of sale.items) {
                    const { data: p } = await _supabase.from('products').select('stock').eq('id', item.id).single();
                    if(p) await _supabase.from('products').update({ stock: p.stock + item.qty }).eq('id', item.id);
                }
                await _supabase.from('sales').update({ type: 'return' }).eq('id', saleId);
                loadSalesData();
            }
        }

        function logout() { sessionStorage.clear(); window.location.replace('index.html'); }
        checkAuth();
    </script>
</body>
</html>
