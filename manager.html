<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة النظام -  OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #050505; --card: #111111; --accent: #00f2fe; --white: #ffffff; --gray: #222; --red: #ff4d4d; --green: #00ff88; --orange: #ffa500; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; transition: 0.3s; }
        body { background: var(--bg); color: var(--white); margin: 0; padding: 20px; overflow-x: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--card); border-radius: 15px; border: 1px solid var(--gray); margin-bottom: 20px; }
        .store-info { display: flex; align-items: center; gap: 15px; }
        .version-tag { background: rgba(0, 242, 254, 0.1); color: var(--accent); padding: 4px 12px; border-radius: 8px; font-size: 12px; border: 1px solid var(--accent); font-weight: bold; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border: 1px solid var(--gray); padding: 25px; border-radius: 20px; text-align: center; }
        .stat-card h3 { font-size: 14px; color: #888; margin: 0; }
        .stat-card p { font-size: 32px; font-weight: bold; margin: 10px 0 0 0; color: var(--accent); }

        /* تنسيق الرسم البياني */
        .chart-container { background: var(--card); border: 1px solid var(--gray); padding: 20px; border-radius: 20px; margin-bottom: 30px; height: 300px; }

        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .nav-item { background: var(--card); border: 1px solid var(--gray); padding: 15px; border-radius: 15px; text-align: center; cursor: pointer; text-decoration: none; color: #fff; }
        .nav-item:hover { border-color: var(--accent); transform: translateY(-3px); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 15px; border-bottom: 1px solid var(--gray); padding-bottom: 10px; }
        .section-title { font-size: 18px; color: var(--accent); margin: 0; }
        
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid var(--gray); margin-bottom: 20px; }
        th { background: #1a1a1a; padding: 12px; text-align: right; color: var(--accent); font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid var(--gray); font-size: 13px; }

        .btn { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-add { background: var(--accent); color: #000; }
        .btn-del { background: var(--red); color: #fff; }
        .btn-contact { background: var(--orange); color: #000; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--accent); width: 450px; }
        input { width: 100%; background: #000; border: 1px solid var(--gray); color: #fff; padding: 10px; border-radius: 8px; margin-top: 10px; }

        .emp-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); }
        .shortage-badge { background: var(--red); color: white; padding: 2px 8px; border-radius: 5px; font-size: 11px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="store-info">
            <div style="cursor: pointer; font-size: 24px;" onclick="location.href='3dadat.html'">⚙️</div>
            <h2 id="display-store-name">لوحة التحكم</h2>
            <div class="version-tag">V 2.0</div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-contact" onclick="location.href='about.html'">📞 تواصل معنا</button>
            <button class="btn btn-del" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>إجمالي مبيعات اليوم</h3><p id="total-sales">0.00</p></div>
        <div class="stat-card"><h3>عدد العمليات</h3><p id="today-count">0</p></div>
    </div>

    <div class="chart-container">
        <canvas id="salesChart"></canvas>
    </div>

    <div class="nav-grid">
        <div class="nav-item" onclick="location.href='inventory.html'">📦 المخزن</div>
        <div class="nav-item" onclick="location.href='pos.html'">🖥️ الكاشير</div>
        <div class="nav-item" onclick="location.href='reports.html'">📊 التقارير</div>
    </div>

    <div class="section-header">
        <h3 class="section-title">⚠️ نواقص المخزن الحالية</h3>
    </div>
    <table id="shortage-table">
        <thead>
            <tr><th>الصنف</th><th>الكمية الحالية</th><th>حد التنبيه</th><th>الإجراء</th></tr>
        </thead>
        <tbody id="shortage-list"></tbody>
    </table>

    <div class="section-header">
        <h3 class="section-title">👥 إدارة الفريق</h3>
        <button class="btn btn-add" onclick="openUserModal()">+ إضافة موظف</button>
    </div>
    <table>
        <thead>
            <tr><th>الموظف</th><th>الصلاحية</th><th>مبيعات الشهر</th><th>التارجت</th><th>الإجراءات</th></tr>
        </thead>
        <tbody id="users-list"></tbody>
    </table>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3 id="user-modal-title" style="color: var(--accent);">إضافة موظف جديد</h3>
            <input type="hidden" id="edit-user-id">
            <input type="text" id="u-name" placeholder="اسم المستخدم">
            <input type="text" id="u-phone" placeholder="رقم الهاتف">
            <input type="number" id="u-target" placeholder="التارجت الشهري">
            <input type="text" id="u-img" placeholder="رابط صورة الموظف">
            <select id="u-role" style="width:100%; background:#000; color:#fff; padding:10px; margin-top:10px; border-radius:8px; border:1px solid var(--gray);">
                <option value="staff">موظف</option>
                <option value="manager">مدير</option>
            </select>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn btn-add" style="flex:1" onclick="saveUser()">حفظ</button>
                <button class="btn" style="flex:1; background:var(--gray); color:#fff" onclick="closeModal('userModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');
        let salesChart;

        async function init() {
            if(!storeKey) return location.href='index.html';
            loadDashboardData();
            loadShortages();
            loadUsers();
        }

        async function loadDashboardData() {
            const today = new Date().toISOString().split('T')[0];
            const { data: sales } = await _supabase.from('sales').select('*').eq('store_key', storeKey).gte('created_at', today);
            
            let total = 0;
            let hourlyData = Array(24).fill(0);
            
            sales?.forEach(s => {
                total += s.total_amount;
                const hour = new Date(s.created_at).getHours();
                hourlyData[hour] += s.total_amount;
            });

            document.getElementById('total-sales').innerText = total.toLocaleString() + " ج.م";
            document.getElementById('today-count').innerText = sales?.length || 0;
            renderChart(hourlyData);
        }

        function renderChart(data) {
            const ctx = document.getElementById('salesChart').getContext('2d');
            if(salesChart) salesChart.destroy();
            salesChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => i + ":00"),
                    datasets: [{
                        label: 'مبيعات اليوم بالساعة',
                        data: data,
                        borderColor: '#00f2fe',
                        backgroundColor: 'rgba(0, 242, 254, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        async function loadShortages() {
            const { data: products } = await _supabase.from('products').select('*').eq('store_key', storeKey);
            const list = document.getElementById('shortage-list');
            list.innerHTML = products?.filter(p => p.stock <= (p.alert_limit || 5)).map(p => `
                <tr>
                    <td>${p.product_name}</td>
                    <td style="color:var(--red); font-weight:bold;">${p.stock}</td>
                    <td>${p.alert_limit || 5}</td>
                    <td><button class="btn btn-add" onclick="location.href='inventory.html'">طلب</button></td>
                </tr>
            `).join('') || '<tr><td colspan="4" style="text-align:center">لا يوجد نواقص حالياً</td></tr>';
        }

        async function loadUsers() {
            const { data: users } = await _supabase.from('users').select('*').eq('store_key', storeKey);
            const list = document.getElementById('users-list');
            list.innerHTML = users?.map(u => `
                <tr>
                    <td><img src="${u.image_url || 'https://via.placeholder.com/40'}" class="emp-img"> ${u.username}</td>
                    <td>${u.role === 'manager' ? 'مدير' : 'موظف'}</td>
                    <td style="color:var(--green); font-weight:bold;">${u.monthly_sales || 0} ج.م</td>
                    <td>${u.monthly_target || 0} ج.م</td>
                    <td>
                        <button class="btn btn-add" onclick="editUser('${u.username}')">تعديل</button>
                        <button class="btn btn-del" onclick="deleteUser('${u.username}')">حذف</button>
                    </td>
                </tr>
            `).join('') || '';
        }

        function openUserModal() { 
            document.getElementById('edit-user-id').value = "";
            document.getElementById('user-modal-title').innerText = "إضافة موظف جديد";
            document.getElementById('userModal').style.display = 'flex'; 
        }

        async function editUser(username) {
            const { data: u } = await _supabase.from('users').select('*').eq('username', username).single();
            document.getElementById('edit-user-id').value = u.username;
            document.getElementById('u-name').value = u.username;
            document.getElementById('u-phone').value = u.phone || "";
            document.getElementById('u-target').value = u.monthly_target || 0;
            document.getElementById('u-img').value = u.image_url || "";
            document.getElementById('u-role').value = u.role;
            document.getElementById('user-modal-title').innerText = "تعديل بيانات الموظف";
            document.getElementById('userModal').style.display = 'flex';
        }

        async function saveUser() {
            const editId = document.getElementById('edit-user-id').value;
            const userData = {
                username: document.getElementById('u-name').value,
                phone: document.getElementById('u-phone').value,
                monthly_target: parseInt(document.getElementById('u-target').value),
                image_url: document.getElementById('u-img').value,
                role: document.getElementById('u-role').value,
                store_key: storeKey
            };
            
            if(editId) await _supabase.from('users').update(userData).eq('username', editId);
            else await _supabase.from('users').insert([userData]);
            
            closeModal('userModal'); loadUsers();
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function logout() { sessionStorage.clear(); location.replace('index.html'); }
        init();
    </script>
</body>
</html>
