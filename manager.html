<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة النظام - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #050505; --card: #111111; --accent: #00f2fe; --white: #ffffff; --gray: #222; --red: #ff4d4d; --green: #00ff88; --orange: #ffa500; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; transition: 0.3s; }
        body { background: var(--bg); color: var(--white); margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--card); border-radius: 15px; border: 1px solid var(--gray); margin-bottom: 20px; }
        .feedback-box { display: flex; gap: 5px; margin-top: 10px; }
        .feedback-box input { background: #000; border: 1px solid var(--gray); color: #fff; padding: 5px; border-radius: 5px; font-size: 12px; width: 180px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border: 1px solid var(--gray); padding: 20px; border-radius: 15px; text-align: center; }
        .stat-card p { font-size: 28px; font-weight: bold; color: var(--accent); }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; margin-top: 10px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--gray); font-size: 13px; }
        th { background: #1a1a1a; color: var(--accent); }
        .btn { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-add { background: var(--accent); color: #000; }
        .btn-del { background: var(--red); color: #fff; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--accent); width: 400px; }
        input { width: 100%; background: #000; border: 1px solid var(--gray); color: #fff; padding: 10px; border-radius: 8px; margin-top: 10px; }
        .emp-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 id="welcome-msg" style="margin:0">مرحباً..</h2>
            <span id="store-name-top" style="color: var(--accent); font-size: 14px;">Fateen OS</span>
            <div class="feedback-box">
                <input type="text" id="fb-in" placeholder="رسالة للمطور...">
                <button class="btn" style="background:var(--green); color:#000; padding:5px" onclick="sendFeedback()">إرسال</button>
            </div>
        </div>
        <button class="btn btn-del" onclick="logout()">خروج</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>إجمالي اليوم</h3><p id="total-sales">0</p></div>
        <div class="stat-card"><h3>الفواتير</h3><p id="bill-count">0</p></div>
    </div>

    <h3 style="color:var(--accent)">🕒 مبيعات اليوم (اضغط للتفاصيل)</h3>
    <table id="sales-table">
        <thead><tr><th>رقم الفاتورة</th><th>الوقت</th><th>البائع</th><th>المبلغ</th></tr></thead>
        <tbody id="sales-list"></tbody>
    </table>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:30px">
        <h3 style="color:var(--accent)">👥 الفريق (employee)</h3>
        <button class="btn btn-add" onclick="openUserModal()">+ إضافة موظف</button>
    </div>
    <table>
        <thead><tr><th>الموظف</th><th>مبيعات الشهر</th><th>إجراءات</th></tr></thead>
        <tbody id="users-list"></tbody>
    </table>

    <div id="receiptModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--accent)">تفاصيل العملية</h3>
            <div id="receipt-details"></div>
            <button class="btn" style="width:100%; margin-top:20px; background:var(--gray); color:#fff" onclick="closeModal('receiptModal')">إغلاق</button>
        </div>
    </div>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3 id="u-title">إضافة موظف</h3>
            <input type="hidden" id="edit-un">
            <input type="text" id="u-user" placeholder="اسم الموظف">
            <input type="text" id="u-phone" placeholder="رقم الهاتف">
            <input type="number" id="u-target" placeholder="التارجت">
            <p style="font-size:11px; color:#888; margin:10px 0 0">صورة PNG:</p>
            <input type="file" id="u-file" accept="image/png">
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn btn-add" id="save-btn" style="flex:1" onclick="saveUser()">حفظ</button>
                <button class="btn" style="flex:1; background:var(--gray); color:#fff" onclick="closeModal('userModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');
        const managerName = sessionStorage.getItem('username');

        async function init() {
            if(!storeKey) return location.href='index.html';
            document.getElementById('welcome-msg').innerText = `أهلاً يا ${managerName}`;
            const { data: st } = await _supabase.from('stores').select('*').eq('store_key', storeKey).single();
            if(st) {
                document.getElementById('store-name-top').innerText = st.store_name;
                document.getElementById('fb-in').value = st.feedback || "";
            }
            loadSales(); loadUsers();
        }

        async function sendFeedback() {
            const fb = document.getElementById('fb-in').value;
            await _supabase.from('stores').update({ feedback: fb }).eq('store_key', storeKey);
            alert("تم إرسال الفيدباك ✅");
        }

        async function loadSales() {
            const today = new Date().toISOString().split('T')[0];
            const { data: sales } = await _supabase.from('sales').select('*').eq('store_key', storeKey).gte('created_at', today);
            let total = 0;
            document.getElementById('sales-list').innerHTML = sales?.map(s => {
                total += s.total_amount;
                return `<tr style="cursor:pointer" onclick='viewBill(${JSON.stringify(s)})'>
                    <td>#${s.id.toString().slice(-5)}</td>
                    <td>${new Date(s.created_at).toLocaleTimeString('ar-EG')}</td>
                    <td>${s.seller_name}</td>
                    <td>${s.total_amount} ج.م</td>
                </tr>`;
            }).join('') || '';
            document.getElementById('total-sales').innerText = total;
            document.getElementById('bill-count').innerText = sales?.length || 0;
        }

        function viewBill(sale) {
            const items = typeof sale.items === 'string' ? JSON.parse(sale.items) : sale.items;
            let html = `<b>البائع: ${sale.seller_name}</b><hr><table>`;
            items.forEach(i => html += `<tr><td>${i.product_name}</td><td>${i.qty}</td><td>${i.price}</td></tr>`);
            html += `</table><h3>الإجمالي: ${sale.total_amount}</h3>`;
            document.getElementById('receipt-details').innerHTML = html;
            document.getElementById('receiptModal').style.display='flex';
        }

        async function loadUsers() {
            const { data: users } = await _supabase.from('users').select('*').eq('store_key', storeKey).eq('role', 'employee');
            document.getElementById('users-list').innerHTML = users?.map(u => `
                <tr>
                    <td><img src="${u.image_url || 'https://via.placeholder.com/40'}" class="emp-img"> ${u.username}</td>
                    <td>${(u.monthly_sales || 0).toLocaleString()} ج.م</td>
                    <td>
                        <button class="btn" onclick="editUser('${u.username}')">⚙️</button>
                        <button class="btn btn-del" onclick="delUser('${u.username}')">🗑️</button>
                    </td>
                </tr>`).join('');
        }

        async function saveUser() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "جاري الحفظ..."; btn.disabled = true;

            const uName = document.getElementById('u-user').value;
            const file = document.getElementById('u-file').files[0];
            let imgUrl = "https://via.placeholder.com/150";

            if(file) {
                try {
                    const fName = `${Date.now()}.png`;
                    await _supabase.storage.from('avatars').upload(fName, file);
                    const { data } = _supabase.storage.from('avatars').getPublicUrl(fName);
                    imgUrl = data.publicUrl;
                } catch(e) { console.log("الصورة فشلت، سيتم استخدام الافتراضية"); }
            }

            const userData = {
                username: uName,
                phone: document.getElementById('u-phone').value,
                monthly_target: parseInt(document.getElementById('u-target').value) || 0,
                image_url: imgUrl,
                role: 'employee',
                store_key: storeKey
            };

            const eid = document.getElementById('edit-un').value;
            let res;
            if(eid) res = await _supabase.from('users').update(userData).eq('username', eid);
            else res = await _supabase.from('users').insert([userData]);

            if(res.error) alert("خطأ: " + res.error.message);
            else { closeModal('userModal'); loadUsers(); }
            
            btn.innerText = "حفظ"; btn.disabled = false;
        }

        async function delUser(un) { if(confirm("حذف؟")) { await _supabase.from('users').delete().eq('username', un); loadUsers(); } }
        
        async function editUser(un) {
            const { data: u } = await _supabase.from('users').select('*').eq('username', un).single();
            document.getElementById('edit-un').value = u.username;
            document.getElementById('u-user').value = u.username;
            document.getElementById('u-phone').value = u.phone || "";
            document.getElementById('u-target').value = u.monthly_target || 0;
            document.getElementById('u-title').innerText = "تعديل موظف";
            document.getElementById('userModal').style.display = 'flex';
        }

        function openUserModal() { 
            document.getElementById('edit-un').value=""; 
            document.getElementById('u-user').value="";
            document.getElementById('u-title').innerText="إضافة موظف";
            document.getElementById('userModal').style.display='flex'; 
        }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        function logout() { sessionStorage.clear(); location.replace('index.html'); }
        init();
    </script>
</body>
</html>
