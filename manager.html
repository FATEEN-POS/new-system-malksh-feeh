<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Fateen OS | Manager Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #050505; --card: #111111; --accent: #00f2fe; --white: #ffffff; --gray: #222; --red: #ff4d4d; --green: #00ff88; --orange: #ffa500; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; transition: 0.3s; }
        body { background: var(--bg); color: var(--white); margin: 0; padding: 20px; overflow-x: hidden; }
        
        /* Header Modified */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--card); border-radius: 15px; border: 1px solid var(--gray); margin-bottom: 20px; }
        .store-info { display: flex; align-items: center; gap: 15px; }
        .version-tag { background: rgba(0, 242, 254, 0.1); color: var(--accent); padding: 4px 12px; border-radius: 8px; font-size: 12px; border: 1px solid var(--accent); font-weight: bold; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); border: 1px solid var(--gray); padding: 25px; border-radius: 20px; text-align: center; }
        .stat-card h3 { font-size: 14px; color: #888; margin: 0; }
        .stat-card p { font-size: 32px; font-weight: bold; margin: 10px 0 0 0; color: var(--accent); }

        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .nav-item { background: var(--card); border: 1px solid var(--gray); padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; text-decoration: none; color: #fff; }
        .nav-item:hover { border-color: var(--accent); transform: translateY(-5px); }

        .section-title { font-size: 18px; margin: 20px 0 15px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray); padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid var(--gray); margin-bottom: 20px; }
        th { background: #1a1a1a; padding: 12px; text-align: right; color: var(--accent); font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid var(--gray); font-size: 13px; }

        .btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; }
        .btn-add { background: var(--accent); color: #000; }
        .btn-del { background: var(--red); color: #fff; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--accent); width: 400px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="store-info">
            <h2 id="display-store-name" style="margin:0">جاري التحميل...</h2>
            <div class="version-tag" id="display-sys-v">V 0.0.0</div>
        </div>
        <button class="btn btn-del" onclick="logout()">تسجيل خروج</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>💰 إجمالي المبيعات (الكل)</h3>
            <p id="total-sales">0.00</p>
        </div>
        <div class="stat-card">
            <h3>🧾 عدد فواتير اليوم</h3>
            <p id="today-count">0</p>
        </div>
    </div>

    <div class="nav-grid">
        <div class="nav-item" onclick="location.href='inventory.html'">📦 المخزن والطلبيات</div>
        <div class="nav-item" onclick="location.href='pos.html'">🖥️ شاشة الكاشير</div>
        <div class="nav-item" onclick="location.href='reports.html'">📊 مركز التقارير</div>
        <div class="nav-item" onclick="location.href='settings.html'">⚙️ الإعدادات</div>
    </div>

    <div class="section-title">🧾 مبيعات اليوم بالتفصيل</div>
    <table>
        <thead>
            <tr>
                <th>رقم العملية</th>
                <th>الوقت</th>
                <th>الإجمالي</th>
                <th>الحالة</th>
                <th>إجراءات</th>
            </tr>
        </thead>
        <tbody id="today-sales-table">
            </tbody>
    </table>

    <div class="section-title">
        👥 إدارة فريق العمل
        <button class="btn btn-add" onclick="openUserModal()">+ إضافة موظف</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>الاسم</th>
                <th>الصلاحية</th>
                <th>الهاتف</th>
                <th>إجراءات</th>
            </tr>
        </thead>
        <tbody id="users-list"></tbody>
    </table>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // حل مشكلة الريفرش: التحقق من وجود المفتاح فوراً
        const storeKey = sessionStorage.getItem('store_key');
        if(!storeKey) { window.location.href = 'index.html'; }

        async function init() {
            // جلب بيانات المتجر والنسخة
            const { data: store } = await _supabase.from('stores').select('*').eq('store_key', storeKey).single();
            const { data: vData } = await _supabase.from('system_settings').select('value').eq('key', 'sys_version').single();
            
            if(store) document.getElementById('display-store-name').innerText = "متجر " + store.store_name;
            if(vData) document.getElementById('display-sys-v').innerText = "إصدار " + vData.value;

            loadSalesData();
            loadUsers();
        }

        async function loadSalesData() {
            const today = new Date().toISOString().split('T')[0];
            
            // 1. حساب إجمالي المبيعات الكلي
            const { data: allSales } = await _supabase.from('sales').select('total_amount').eq('store_key', storeKey).eq('type', 'sale');
            let total = 0;
            allSales?.forEach(s => total += s.total_amount);
            document.getElementById('total-sales').innerText = total.toLocaleString() + " ج.م";

            // 2. جلب فواتير اليوم وعرضها في الجدول
            const { data: todaySales } = await _supabase.from('sales')
                .select('*')
                .eq('store_key', storeKey)
                .gte('created_at', today + 'T00:00:00')
                .order('created_at', { ascending: false });

            document.getElementById('today-count').innerText = todaySales?.length || 0;
            
            const tableBody = document.getElementById('today-sales-table');
            tableBody.innerHTML = '';
            
            todaySales?.forEach(sale => {
                const time = new Date(sale.created_at).toLocaleTimeString('ar-EG');
                tableBody.innerHTML += `
                    <tr>
                        <td>#${sale.id.toString().slice(-6)}</td>
                        <td>${time}</td>
                        <td style="font-weight:bold; color:var(--green)">${sale.total_amount} ج.م</td>
                        <td>${sale.type === 'sale' ? 'مكتملة' : 'مرتجع'}</td>
                        <td>
                            <button class="btn btn-del" onclick="returnSale('${sale.id}')">إرجاع</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function loadUsers() {
            const { data: users } = await _supabase.from('users').select('*').eq('store_key', storeKey);
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            users?.forEach(u => {
                list.innerHTML += `
                    <tr>
                        <td>${u.username}</td>
                        <td>${u.role === 'manager' ? 'مدير' : 'موظف'}</td>
                        <td>${u.phone || '---'}</td>
                        <td>
                            <button class="btn" style="background:var(--orange)" onclick="changePass('${u.username}')">كلمة السر</button>
                            <button class="btn btn-del" onclick="deleteUser('${u.username}')">حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function returnSale(saleId) {
            if(!confirm("هل تريد إرجاع هذه الفاتورة وإعادة المنتجات للمخزن؟")) return;
            
            const { data: sale } = await _supabase.from('sales').select('*').eq('id', saleId).single();
            if(sale && sale.items) {
                for (let item of sale.items) {
                    const { data: p } = await _supabase.from('products').select('stock').eq('id', item.id).single();
                    if(p) await _supabase.from('products').update({ stock: p.stock + item.qty }).eq('id', item.id);
                }
                await _supabase.from('sales').update({ type: 'return' }).eq('id', saleId);
                alert("تم إرجاع الفاتورة بنجاح");
                loadSalesData();
            }
        }

        function logout() { sessionStorage.clear(); location.href='index.html'; }

        init();
    </script>
</body>
</html>
