<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #004643; /* الأخضر الغامق */
            --bg-cream: #f0ede5; /* الكريمي */
            --white: #ffffff;
            --text-dark: #001e1d;
        }

        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; transition: 0.3s; }
        
        body { 
            background-color: var(--bg-cream); 
            color: var(--text-dark); 
            margin: 0; 
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1100px; }

        /* الهيدر العلوي */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 0;
        }

        .store-title { display: flex; align-items: center; gap: 10px; }
        .store-title h1 { font-size: 28px; margin: 0; color: var(--primary); font-weight: 800; }
        .icon-settings { font-size: 24px; color: var(--primary); cursor: pointer; }

        /* شريط البحث */
        .search-container { width: 100%; margin-bottom: 20px; text-align: left; }
        .search-bar {
            width: 100%;
            max-width: 400px;
            padding: 10px 40px 10px 15px;
            border-radius: 25px;
            border: 2px solid var(--primary);
            background: var(--white) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%23004643" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>') no-repeat 95% center;
            outline: none;
        }

        /* كروت الإحصائيات */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--primary);
            color: var(--white);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .stat-card span { font-size: 13px; opacity: 0.9; display: block; margin-bottom: 5px; }
        .stat-card b { font-size: 18px; font-weight: 800; }

        /* شبكة التحكم (الأزرار الكبيرة) */
        .nav-section {
            background: var(--primary);
            padding: 30px 20px;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .nav-card {
            background: var(--white);
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .nav-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
        .nav-card i { font-size: 30px; }
        .nav-card span { font-size: 14px; font-weight: 700; line-height: 1.2; }

        /* تذييل الصفحة */
        footer {
            width: 100%;
            background: var(--white);
            padding: 5px 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            color: var(--primary);
        }

        /* الموبايل */
        @media (max-width: 600px) {
            .nav-section { grid-template-columns: repeat(3, 1fr); padding: 15px 10px; }
            .nav-card { padding: 15px 5px; }
            .nav-card span { font-size: 11px; }
            .nav-card i { font-size: 24px; }
            .stat-card b { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="store-title">
            <span class="icon-settings" onclick="location.href='settings.html'">⚙️</span>
            <h1 id="display-store-name">اسم المتجر</h1>
        </div>
        <button onclick="logout()" style="background:none; border:1px solid var(--primary); border-radius:15px; padding:5px 15px; cursor:pointer; font-weight:bold;">خروج</button>
    </header>

    <div class="search-container">
        <input type="text" class="search-bar" placeholder="بحث او ارجاع فاتوره" id="sales-search" oninput="filterSales()">
    </div>

    <div class="stats-row">
        <div class="stat-card"><span>مبيعات :</span><b id="total-sales">0 ج.م</b></div>
        <div class="stat-card"><span>الفواتير:</span><b id="today-count">0</b></div>
        <div class="stat-card"><span>مرتجع :</span><b id="total-returns">0 ج.م</b></div>
    </div>

    <div class="nav-section">
        <a href="users.html" class="nav-card"><i>👥</i><span>اداره الموظفين</span></a>
        <a href="inventory.html" class="nav-card"><i>🏪</i><span>اداره المخزن</span></a>
        <a href="reports.html" class="nav-card"><i>📄</i><span>اداره التقارير</span></a>
        <a href="chat.html" class="nav-card"><i>📞</i><span>تحدث معنا</span></a>
        <a href="pos.html" class="nav-card"><i>📠</i><span>صفحه الكاشير</span></a>
        <a href="daily-sales.html" class="nav-card"><i>💰</i><span>مبيعات اليوم</span></a>
    </div>

    <footer>
        <span>Fateen OS</span>
        <span>V0.5</span>
    </footer>
</div>

<script>
    // إعدادات Supabase من ملفك الأصلي
    const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const storeKey = sessionStorage.getItem('store_key');

    async function init() {
        if(!storeKey) return location.href='index.html';
        const { data: store } = await _supabase.from('stores').select('*').eq('store_key', storeKey).single();
        if(store) document.getElementById('display-store-name').innerText = store.store_name;
        loadDashboardData();
    }

    async function loadDashboardData() {
        const today = new Date().toISOString().split('T')[0];
        const { data: sales } = await _supabase.from('sales')
            .select('*')
            .eq('store_key', storeKey)
            .gte('created_at', today + 'T00:00:00');

        let totalSale = 0, totalReturn = 0, count = 0;
        sales?.forEach(s => {
            if(s.type === 'sale') totalSale += s.total_amount;
            else if(s.type === 'return') totalReturn += s.total_amount;
            count++;
        });

        document.getElementById('total-sales').innerText = totalSale.toLocaleString() + " ج.م";
        document.getElementById('total-returns').innerText = totalReturn.toLocaleString() + " ج.م";
        document.getElementById('today-count').innerText = count;
    }

    function logout() { sessionStorage.clear(); location.replace('index.html'); }
    init();
</script>

</body>
</html>
