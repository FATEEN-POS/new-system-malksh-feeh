<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Fateen OS | Inventory & Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #050505; --card: #111111; --accent: #00f2fe; --white: #ffffff; --gray: #222; --red: #ff4d4d; --green: #00ff88; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; transition: 0.3s; }
        body { background: var(--bg); color: var(--white); margin: 0; padding: 20px; }
        
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .version-badge { background: rgba(0, 242, 254, 0.1); color: var(--accent); padding: 4px 12px; border-radius: 8px; font-size: 12px; border: 1px solid var(--accent); font-weight: bold; }

        .main-title { font-size: 32px; font-weight: 700; color: var(--white); margin: 0; }
        #display-store-name { color: var(--accent); font-size: 18px; margin-top: 5px; display: block; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border: 1px solid var(--gray); padding: 20px; border-radius: 15px; text-align: center; }
        .stat-card h3 { font-size: 14px; color: #888; margin: 0; }
        .stat-card p { font-size: 24px; font-weight: bold; margin: 10px 0 0 0; color: var(--accent); }

        .search-add-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        input { background: var(--card); border: 1px solid var(--gray); color: #fff; padding: 12px; border-radius: 10px; outline: none; }
        .search-input { flex: 1; }
        .btn-add { background: var(--accent); color: #000; border: none; padding: 0 25px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .inventory-container { background: var(--card); border: 1px solid var(--gray); border-radius: 15px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1a1a1a; padding: 15px; text-align: right; color: var(--accent); font-size: 14px; }
        td { padding: 15px; border-bottom: 1px solid var(--gray); font-size: 14px; }
        tr:hover { background: rgba(255,255,255,0.02); }

        .expiry-warning { color: var(--red); font-weight: bold; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--accent); width: 400px; }
        .modal-content h2 { margin-top: 0; color: var(--accent); }
        .modal-content input { width: 100%; margin-bottom: 15px; }
        
        .btn-edit { color: var(--accent); background: none; border: none; cursor: pointer; margin-left: 10px; }
        .btn-delete { color: var(--red); background: none; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-nav">
        <div>
            <h1 class="main-title">إدارة المخزن والطلبيات</h1>
            <span id="display-store-name">تحميل اسم المتجر...</span>
        </div>
        <div class="version-badge" id="display-sys-v">V 0.0.0</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>إجمالي الأصناف</h3><p id="total-items">0</p></div>
        <div class="stat-card"><h3>نواقص المخزن</h3><p id="low-stock" style="color:var(--red)">0</p></div>
        <div class="stat-card"><h3>قيمة المخزن تقريباً</h3><p id="inv-value">0 ج.م</p></div>
    </div>

    <div class="search-add-bar">
        <input type="text" id="search-box" class="search-input" placeholder="بحث بالاسم أو الباركود..." oninput="loadInventory()">
        <button class="btn-add" onclick="openAddModal()">+ إضافة صنف جديد</button>
        <button class="btn-add" style="background:#fff" onclick="location.href='manager.html'">↩ رجوع</button>
    </div>

    <div class="inventory-container">
        <table>
            <thead>
                <tr>
                    <th>الباركود</th>
                    <th>اسم الصنف</th>
                    <th>الكمية</th>
                    <th>سعر البيع</th>
                    <th>تاريخ الانتهاء</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="inventory-table">
                </tbody>
        </table>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">إضافة صنف جديد</h2>
            <input type="hidden" id="edit-id">
            <input type="text" id="p-barcode" placeholder="الباركود (اختياري)">
            <input type="text" id="p-name" placeholder="اسم الصنف">
            <input type="number" id="p-stock" placeholder="الكمية الحالية">
            <input type="number" id="p-price" placeholder="سعر البيع">
            <input type="number" id="p-cost" placeholder="سعر التكلفة">
            <input type="date" id="p-expiry" placeholder="تاريخ الانتهاء">
            <button class="btn-add" style="width:100%" onclick="saveProduct()">حفظ البيانات</button>
            <button class="btn-add" style="width:100%; background:none; color:#888; margin-top:10px;" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const storeKey = sessionStorage.getItem('store_key');

        async function init() {
            if(!storeKey) return location.href='index.html';
            
            // جلب بيانات المتجر والإصدار
            const { data: store } = await _supabase.from('stores').select('store_name').eq('store_key', storeKey).single();
            const { data: vData } = await _supabase.from('system_settings').select('value').eq('key', 'sys_version').single();
            
            if(store) document.getElementById('display-store-name').innerText = "متجر " + store.store_name;
            if(vData) document.getElementById('display-sys-v').innerText = "V " + vData.value;

            loadInventory();
        }

        async function loadInventory() {
            const searchTerm = document.getElementById('search-box').value;
            let query = _supabase.from('products').select('*').eq('store_key', storeKey).order('product_name');
            
            if(searchTerm) {
                query = query.or(`product_name.ilike.%${searchTerm}%,barcode.ilike.%${searchTerm}%`);
            }

            const { data: products } = await query;
            const tableBody = document.getElementById('inventory-table');
            tableBody.innerHTML = '';

            let totalVal = 0;
            let lowCount = 0;

            products?.forEach(p => {
                totalVal += (p.stock * p.price);
                if(p.stock <= 5) lowCount++;

                const isExpired = p.expiry_date && new Date(p.expiry_date) < new Date();
                
                tableBody.innerHTML += `
                    <tr>
                        <td>${p.barcode || '---'}</td>
                        <td>${p.product_name}</td>
                        <td style="font-weight:bold; color:${p.stock <= 5 ? 'var(--red)' : 'var(--green)'}">${p.stock}</td>
                        <td>${p.price} ج.م</td>
                        <td class="${isExpired ? 'expiry-warning' : ''}">${p.expiry_date || 'غير محدد'}</td>
                        <td>
                            <button class="btn-edit" onclick="openEditModal('${p.id}')">تعديل</button>
                            <button class="btn-delete" onclick="deleteProduct('${p.id}')">حذف</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('total-items').innerText = products?.length || 0;
            document.getElementById('low-stock').innerText = lowCount;
            document.getElementById('inv-value').innerText = totalVal.toLocaleString() + " ج.م";
        }

        function openAddModal() {
            document.getElementById('modal-title').innerText = "إضافة صنف جديد";
            document.getElementById('edit-id').value = "";
            document.getElementById('p-barcode').value = "";
            document.getElementById('p-name').value = "";
            document.getElementById('p-stock').value = "";
            document.getElementById('p-price').value = "";
            document.getElementById('p-cost').value = "";
            document.getElementById('p-expiry').value = "";
            document.getElementById('productModal').style.display = 'flex';
        }

        async function openEditModal(id) {
            const { data: p } = await _supabase.from('products').select('*').eq('id', id).single();
            if(p) {
                document.getElementById('modal-title').innerText = "تعديل صنف";
                document.getElementById('edit-id').value = p.id;
                document.getElementById('p-barcode').value = p.barcode || "";
                document.getElementById('p-name').value = p.product_name;
                document.getElementById('p-stock').value = p.stock;
                document.getElementById('p-price').value = p.price;
                document.getElementById('p-cost').value = p.cost_price || "";
                document.getElementById('p-expiry').value = p.expiry_date || "";
                document.getElementById('productModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        async function saveProduct() {
            const id = document.getElementById('edit-id').value;
            const productData = {
                store_key: storeKey,
                barcode: document.getElementById('p-barcode').value,
                product_name: document.getElementById('p-name').value,
                stock: parseInt(document.getElementById('p-stock').value),
                price: parseFloat(document.getElementById('p-price').value),
                cost_price: parseFloat(document.getElementById('p-cost').value) || 0,
                expiry_date: document.getElementById('p-expiry').value || null
            };

            if(!productData.product_name || isNaN(productData.stock)) return alert("يرجى ملء البيانات الأساسية");

            if(id) {
                // تعديل
                await _supabase.from('products').update(productData).eq('id', id);
            } else {
                // إضافة جديد
                await _supabase.from('products').insert([productData]);
            }

            closeModal();
            loadInventory();
        }

        async function deleteProduct(id) {
            if(confirm("هل أنت متأكد من حذف هذا الصنف نهائياً من المخزن؟")) {
                await _supabase.from('products').delete().eq('id', id);
                loadInventory();
            }
        }

        init();
    </script>
</body>
</html>
