<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المخزن - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #004643; /* الأخضر الغامق من الصورة */
            --bg-cream: #f0ede5; /* اللون الكريمي الخلفية */
            --accent-yellow: #f9bc60;
            --white: #ffffff;
            --text-dark: #001e1d;
        }

        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; transition: 0.3s; }
        
        body { 
            background-color: var(--bg-cream); 
            color: var(--text-dark); 
            margin: 0; 
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1200px; }

        /* الهيدر */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .title-section h1 { font-size: 28px; margin: 0; color: var(--primary); font-weight: 800; }
        .title-section span { font-size: 16px; color: #555; }

        .version-tag {
            background: var(--primary);
            color: var(--white);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        /* الكروت الإحصائية */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--primary);
            color: var(--white);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card.warning { background: #d9534f; }
        .stat-card h3 { font-size: 12px; margin: 0 0 5px 0; opacity: 0.8; }
        .stat-card p { font-size: 18px; margin: 0; font-weight: 800; }

        /* شريط البحث والأزرار */
        .actions-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 2;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border-radius: 25px;
            border: 2px solid var(--primary);
            outline: none;
            background: var(--white);
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            border-radius: 25px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* الجدول - متجاوب */
        .table-wrapper {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        table { width: 100%; border-collapse: collapse; }
        
        thead { background: var(--primary); color: white; }
        
        th, td { padding: 15px; text-align: center; font-size: 14px; border-bottom: 1px solid #eee; }

        /* تصميم الموبايل للجدول */
        @media (max-width: 768px) {
            th:nth-child(1), td:nth-child(1), /* إخفاء الباركود في الموبايل لتوفير مساحة */
            th:nth-child(4), td:nth-child(4), /* إخفاء سعر الشراء */
            th:nth-child(6), td:nth-child(6)  /* إخفاء تاريخ الانتهاء */
            { display: none; }
            
            .title-section h1 { font-size: 22px; }
            .stat-card p { font-size: 15px; }
        }

        .btn-edit { color: var(--primary); cursor: pointer; font-weight: 700; text-decoration: underline; }
        .btn-del { color: #d9534f; cursor: pointer; font-weight: 700; margin-right: 10px; }

        /* المودال */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--white); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-section">
            <h1>إدارة المخزن والطلبيات</h1>
            <span id="store-name">تحميل...</span>
        </div>
        <div class="version-tag">Fateen OS V0.5</div>
    </header>

    <div class="stats-container">
        <div class="stat-card"><h3>إجمالي الأصناف</h3><p id="total-items">0</p></div>
        <div class="stat-card"><h3>قيمة المخزن</h3><p id="inv-value">0 ج.م</p></div>
        <div class="stat-card"><h3>النواقص</h3><p id="low-stock">0</p></div>
        <div class="stat-card warning"><h3>نواقص عاجلة ⚠️</h3><p id="urgent-stock">0</p></div>
    </div>

    <div class="actions-bar">
        <div class="search-box">
            <input type="text" id="search-box" placeholder="بحث بالاسم او الباركود..." oninput="loadInventory()">
        </div>
        <button class="btn" onclick="openAddModal()">اضافه صنف</button>
        <button class="btn" onclick="openOrderModal()">اضافه طلبيه</button>
        <button class="btn" onclick="location.href='manager.html'">رجوع</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>الباركود</th>
                    <th>اسم الصنف</th>
                    <th>الكمية</th>
                    <th>سعر الشراء</th>
                    <th>سعر البيع</th>
                    <th>تاريخ الانتهاء</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="inventory-table">
                </tbody>
        </table>
    </div>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title">بيانات الصنف</h2>
        <input type="hidden" id="edit-id">
        <input type="text" id="p-barcode" placeholder="الباركود">
        <input type="text" id="p-name" placeholder="اسم الصنف">
        <input type="number" id="p-stock" placeholder="الكمية">
        <input type="number" id="p-cost" placeholder="سعر الشراء">
        <input type="number" id="p-price" placeholder="سعر البيع">
        <button class="btn" onclick="saveProduct()">حفظ التعديلات</button>
        <button class="btn" style="background:#888; margin-top:5px;" onclick="closeModal('productModal')">إغلاق</button>
    </div>
</div>

<script>
    // نفس إعدادات Supabase والـ Script اللي كانت موجودة في ملفك الأصلي
    const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const storeKey = sessionStorage.getItem('store_key');

    async function init() {
        if(!storeKey) return location.href='index.html';
        const { data: store } = await _supabase.from('stores').select('store_name').eq('store_key', storeKey).single();
        if(store) document.getElementById('store-name').innerText = "متجر: " + store.store_name;
        loadInventory();
    }

    async function loadInventory() {
        const search = document.getElementById('search-box').value;
        let query = _supabase.from('products').select('*').eq('store_key', storeKey);
        if(search) query = query.or(`product_name.ilike.%${search}%,barcode.ilike.%${search}%`);
        const { data: products } = await query;

        const table = document.getElementById('inventory-table');
        table.innerHTML = '';
        let totalVal = 0, low = 0, urgent = 0;

        products?.forEach(p => {
            totalVal += (p.stock * p.price);
            if(p.stock <= 5 && p.stock > 0) low++;
            if(p.stock <= 0) urgent++;

            table.innerHTML += `
                <tr>
                    <td>${p.barcode || '-'}</td>
                    <td style="font-weight:bold">${p.product_name}</td>
                    <td style="color:${p.stock <= 5 ? 'red' : 'green'}">${p.stock}</td>
                    <td>${p.cost_price}</td>
                    <td style="font-weight:800">${p.price}</td>
                    <td>${p.expiry_date || '-'}</td>
                    <td>
                        <span class="btn-edit" onclick="openEditModal('${p.id}')">تعديل</span>
                        <span class="btn-del" onclick="deleteProduct('${p.id}')">حذف</span>
                    </td>
                </tr>
            `;
        });

        document.getElementById('total-items').innerText = products?.length || 0;
        document.getElementById('inv-value').innerText = totalVal.toLocaleString() + " ج.م";
        document.getElementById('low-stock').innerText = low;
        document.getElementById('urgent-stock').innerText = urgent;
    }

    // دوال المودال والحفظ (مأخوذة من منطق الكود الأصلي)
    function openAddModal() { document.getElementById('productModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    async function openEditModal(id) {
        const { data: p } = await _supabase.from('products').select('*').eq('id', id).single();
        if(p) {
            document.getElementById('edit-id').value = p.id;
            document.getElementById('p-barcode').value = p.barcode;
            document.getElementById('p-name').value = p.product_name;
            document.getElementById('p-stock').value = p.stock;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-cost').value = p.cost_price;
            document.getElementById('productModal').style.display = 'flex';
        }
    }

    async function saveProduct() {
        const id = document.getElementById('edit-id').value;
        const data = {
            store_key: storeKey,
            barcode: document.getElementById('p-barcode').value,
            product_name: document.getElementById('p-name').value,
            stock: parseInt(document.getElementById('p-stock').value),
            price: parseFloat(document.getElementById('p-price').value),
            cost_price: parseFloat(document.getElementById('p-cost').value)
        };
        if(id) await _supabase.from('products').update(data).eq('id', id);
        else await _supabase.from('products').insert([data]);
        closeModal('productModal'); loadInventory();
    }

    async function deleteProduct(id) {
        if(confirm("حذف الصنف؟")) {
            await _supabase.from('products').delete().eq('id', id);
            loadInventory();
        }
    }

    init();
</script>

</body>
</html>
