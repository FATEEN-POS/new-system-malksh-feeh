<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المخزن - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #111; --accent: #00f2fe; --white: #fff; --gray: #1a1a1a; --red: #ff4d4d; --green: #00ff88; --orange: #ffa500; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background: var(--bg); color: var(--white); margin: 0; padding: 20px; }
        
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--gray); padding-bottom: 15px; }
        .store-title { color: var(--accent); font-weight: 800; font-size: 24px; }

        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
        th { background: #1a1a1a; padding: 15px; text-align: right; color: var(--accent); border-bottom: 2px solid var(--accent); }
        td { padding: 15px; border-bottom: 1px solid #222; }
        tr:hover { background: rgba(0, 242, 254, 0.02); }

        .btn-action { background: var(--accent); color: #000; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .barcode-pill { background: #000; color: var(--accent); padding: 4px 10px; border-radius: 6px; border: 1px solid #333; font-family: monospace; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #0a0a0a; padding: 25px; border-radius: 20px; border: 1px solid var(--accent); width: 400px; }
        
        input, select { background: #111; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; width: 100%; outline: none; margin-top: 5px; margin-bottom: 15px; }
        label { font-size: 13px; color: #888; }

        /* منطقة الطباعة */
        #print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { 
                position: absolute; left: 0; top: 0; 
                width: 40mm; height: 30mm; border: 2px solid #000;
                display: flex !important; flex-direction: column;
                align-items: center; justify-content: center;
                background: white; color: black; padding: 2mm;
            }
            #pr-barcode { width: 90%; height: auto; }
        }
    </style>
</head>
<body>

    <div class="header-section">
        <div>
            <div id="store-name-display" class="store-title">محلي الرقمي</div>
            <p style="margin:5px 0 0; color:#666">نظام الجرد والباركود الذكي</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-action" style="background:var(--orange)" onclick="exportToExcel()">📥 جرد (Excel)</button>
            <button class="btn-action" style="background:var(--green)" onclick="openOrderModal()">📦 توريد</button>
            <button class="btn-action" onclick="openAddModal()">+ صنف جديد</button>
            <button class="btn-action" style="background:#fff" onclick="location.href='manager.html'">↩ رجوع</button>
        </div>
    </div>

    <input type="text" id="main-search" placeholder="ابحث باسم المنتج أو الباركود..." oninput="loadInventory()">

    <table>
        <thead>
            <tr>
                <th>الباركود</th>
                <th>المنتج</th>
                <th>المخزون</th>
                <th>سعر الشراء</th>
                <th>سعر البيع</th>
                <th>تحكم</th>
            </tr>
        </thead>
        <tbody id="inventory-table"></tbody>
    </table>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top:0">بيانات الصنف</h2>
            <input type="hidden" id="edit-id">
            
            <label>الباركود</label>
            <div style="display:flex; gap:5px">
                <input type="text" id="p-barcode" placeholder="أدخل الباركود">
                <button onclick="generateBarcode()" style="height:45px; background:var(--gray); border:1px solid #333; color:white; border-radius:8px; cursor:pointer">🎲</button>
            </div>

            <label>اسم الصنف</label>
            <input type="text" id="p-name">
            
            <div style="display: flex; gap: 10px;">
                <div style="flex:1"><label>الكمية</label><input type="number" id="p-stock" value="0"></div>
                <div style="flex:1"><label>الشراء</label><input type="number" id="p-cost" value="0"></div>
                <div style="flex:1"><label>البيع</label><input type="number" id="p-price" value="0"></div>
            </div>

            <button class="btn-action" style="width:100%; justify-content:center" onclick="saveProduct()">حفظ الصنف</button>
            <button onclick="closeModal('productModal')" style="width:100%; background:none; border:none; color:#555; margin-top:10px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--green); margin-top:0">📦 إضافة توريد</h2>
            <label>اختر المنتج</label>
            <select id="order-product-select"></select>
            <label>الكمية الواصلة</label>
            <input type="number" id="order-qty" value="1">
            <button class="btn-action" style="width:100%; background:var(--green); justify-content:center" onclick="submitOrder()">تأكيد الإضافة</button>
            <button onclick="closeModal('orderModal')" style="width:100%; background:none; border:none; color:#555; margin-top:10px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <div id="print-area">
        <div id="pr-store" style="font-size: 8pt; font-weight: bold; margin-bottom: 2px; text-transform: uppercase;"></div>
        <div id="pr-name" style="font-size: 10pt; font-weight: bold; white-space: nowrap; overflow: hidden; width: 100%;"></div>
        <svg id="pr-barcode"></svg>
        <div id="pr-price" style="font-size: 11pt; font-weight: 800; border-top: 1px solid #000; width: 80%; margin-top: 2px;"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');
        let storeName = "Fateen Store";
        let allProducts = [];

        async function init() {
            const { data: store } = await _supabase.from('stores').select('store_name').eq('store_key', storeKey).single();
            if(store) {
                storeName = store.store_name;
                document.getElementById('store-name-display').innerText = storeName;
            }
            loadInventory();
        }

        async function loadInventory() {
            const search = document.getElementById('main-search').value;
            let { data } = await _supabase.from('products').select('*').eq('store_key', storeKey);
            if(search) data = data.filter(p => p.product_name.includes(search) || (p.barcode && p.barcode.includes(search)));
            
            allProducts = data || [];
            const tbody = document.getElementById('inventory-table');
            const select = document.getElementById('order-product-select');
            
            tbody.innerHTML = '';
            select.innerHTML = '<option value="">-- اختر صنف --</option>';

            allProducts.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.product_name}</option>`;
                tbody.innerHTML += `
                    <tr>
                        <td><span class="barcode-pill">${p.barcode || '---'}</span></td>
                        <td style="font-weight:600">${p.product_name}</td>
                        <td style="color:${p.stock <= 5 ? 'var(--red)' : 'var(--green)'}; font-weight:bold">${p.stock}</td>
                        <td>${p.cost_price || 0} ج.م</td>
                        <td style="color:var(--accent); font-weight:bold">${p.price} ج.م</td>
                        <td>
                            <button onclick="printLabel('${p.barcode}','${p.product_name}','${p.price}')" style="background:none; border:none; cursor:pointer; font-size:18px">🖨️</button>
                            <button onclick="openEditModal('${p.id}')" style="background:none; border:none; color:#888; cursor:pointer; margin-right:10px;">⚙️</button>
                        </td>
                    </tr>`;
            });
        }

        function generateBarcode() {
            document.getElementById('p-barcode').value = "FTN" + Math.floor(100000 + Math.random() * 900000);
        }

        async function exportToExcel() {
            const today = new Date().toLocaleDateString('ar-EG');
            let totalStock = 0, totalCost = 0, totalValue = 0;

            const data = allProducts.map(p => {
                const stock = p.stock || 0;
                const cost = p.cost_price || 0;
                const price = p.price || 0;
                
                totalStock += stock;
                totalCost += (stock * cost);
                totalValue += (stock * price);

                return {
                    "اسم المحل": storeName,
                    "التاريخ": today,
                    "الباركود": p.barcode,
                    "اسم المنتج": p.product_name,
                    "الكمية": stock,
                    "سعر الشراء": cost,
                    "سعر البيع": price,
                    "قيمة المخزن (شراء)": stock * cost,
                    "قيمة المخزن (بيع)": stock * price
                };
            });

            // إضافة سطر المجموع في النهاية
            data.push({});
            data.push({
                "اسم المنتج": "الإجماليات الكلية >>>",
                "الكمية": totalStock,
                "قيمة المخزن (شراء)": totalCost,
                "قيمة المخزن (بيع)": totalValue
            });

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "الجرد");
            XLSX.writeFile(wb, `جرد_${storeName}_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        function printLabel(code, name, price) {
            if(!code) return alert("لا يوجد باركود لهذا الصنف!");
            document.getElementById('pr-store').innerText = storeName;
            document.getElementById('pr-name').innerText = name;
            document.getElementById('pr-price').innerText = price + " ج.م";
            
            JsBarcode("#pr-barcode", code, {
                format: "CODE128",
                width: 2,
                height: 40,
                displayValue: true,
                fontSize: 14
            });
            window.print();
        }

        function openAddModal() {
            document.getElementById('edit-id').value = "";
            document.getElementById('p-name').value = "";
            document.getElementById('p-stock').value = "0";
            document.getElementById('p-cost').value = "0";
            document.getElementById('p-price').value = "0";
            generateBarcode(); // توليد باركود تلقائي فور الفتح
            document.getElementById('productModal').style.display = 'flex';
        }

        async function saveProduct() {
            const data = {
                store_key: storeKey,
                barcode: document.getElementById('p-barcode').value,
                product_name: document.getElementById('p-name').value,
                stock: parseInt(document.getElementById('p-stock').value),
                cost_price: parseFloat(document.getElementById('p-cost').value),
                price: parseFloat(document.getElementById('p-price').value)
            };
            const id = document.getElementById('edit-id').value;
            if(id) await _supabase.from('products').update(data).eq('id', id);
            else await _supabase.from('products').insert([data]);
            closeModal('productModal'); loadInventory();
        }

        async function submitOrder() {
            const id = document.getElementById('order-product-select').value;
            const qty = parseInt(document.getElementById('order-qty').value);
            if(!id || isNaN(qty)) return alert("يرجى اختيار صنف");
            const p = allProducts.find(x => x.id == id);
            await _supabase.from('products').update({ stock: p.stock + qty }).eq('id', id);
            alert("✅ تم توريد الكمية"); closeModal('orderModal'); loadInventory();
        }

        function openEditModal(id) {
            const p = allProducts.find(x => x.id == id);
            document.getElementById('edit-id').value = p.id;
            document.getElementById('p-barcode').value = p.barcode;
            document.getElementById('p-name').value = p.product_name;
            document.getElementById('p-stock').value = p.stock;
            document.getElementById('p-cost').value = p.cost_price;
            document.getElementById('p-price').value = p.price;
            document.getElementById('productModal').style.display = 'flex';
        }

        function openOrderModal() { document.getElementById('orderModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        init();
    </script>
</body>
</html>
