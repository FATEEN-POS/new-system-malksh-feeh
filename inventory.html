<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المخزن - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #111; --accent: #00f2fe; --white: #fff; --gray: #1a1a1a; --red: #ff4d4d; --green: #00ff88; --orange: #ffa500; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background: var(--bg); color: var(--white); margin: 0; padding: 20px; }
        
        /* تمييز بصري للجدول */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: var(--card); border-radius: 12px; overflow: hidden; }
        th { background: var(--gray); padding: 15px; text-align: right; color: var(--accent); }
        td { padding: 15px; border-bottom: 1px solid #222; }
        tr:hover { background: rgba(255, 255, 255, 0.03); }

        .btn-action { background: var(--accent); color: #000; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .barcode-pill { background: #000; color: var(--accent); padding: 4px 10px; border-radius: 6px; border: 1px solid #333; font-family: monospace; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #0a0a0a; padding: 25px; border-radius: 20px; border: 1px solid var(--accent); width: 400px; }
        
        input, select { background: #111; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; width: 100%; outline: none; margin-top: 5px; margin-bottom: 15px; }

        /* تنسيق استيكر الباركود للطباعة */
        #print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { 
                position: absolute; left: 0; top: 0; 
                width: 40mm; height: 30mm; 
                border: 1px solid #000;
                display: flex !important; flex-direction: column;
                align-items: center; justify-content: center;
                text-align: center; color: black; background: white;
            }
            #pr-barcode { width: 100%; max-height: 15mm; }
        }
    </style>
</head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h1 style="margin:0;">📦 إدارة المخزن</h1>
        <div style="display: flex; gap: 10px;">
            <button class="btn-action" style="background:var(--orange)" onclick="exportToExcel()">📥 جرد المخزن (Excel)</button>
            <button class="btn-action" style="background:var(--green)" onclick="openOrderModal()">➕ طلبية توريد</button>
            <button class="btn-action" onclick="openAddModal()">+ صنف جديد</button>
            <button class="btn-action" style="background:#fff" onclick="location.href='manager.html'">↩ رجوع</button>
        </div>
    </div>

    <input type="text" id="main-search" placeholder="بحث باسم المنتج أو الباركود..." oninput="loadInventory()" style="margin-bottom: 20px;">

    <table>
        <thead>
            <tr>
                <th>الباركود</th>
                <th>المنتج</th>
                <th>المخزون</th>
                <th>سعر الشراء</th>
                <th>سعر البيع</th>
                <th>تحكم</th>
            </tr>
        </thead>
        <tbody id="inventory-table"></tbody>
    </table>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--green)">📦 توريد كمية</h2>
            <label>اختر المنتج</label>
            <select id="order-product-select"></select>
            <label>الكمية المضافة</label>
            <input type="number" id="order-qty" value="1">
            <button class="btn-action" style="width:100%; background:var(--green); justify-content:center" onclick="submitOrder()">تأكيد الإضافة</button>
            <button onclick="closeModal('orderModal')" style="width:100%; background:none; border:none; color:#555; margin-top:10px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">بيانات الصنف</h2>
            <input type="hidden" id="edit-id">
            <label>الباركود</label>
            <input type="text" id="p-barcode">
            <label>اسم الصنف</label>
            <input type="text" id="p-name">
            <div style="display: flex; gap: 10px;">
                <div style="flex:1"><label>الكمية</label><input type="number" id="p-stock"></div>
                <div style="flex:1"><label>الشراء</label><input type="number" id="p-cost"></div>
                <div style="flex:1"><label>البيع</label><input type="number" id="p-price"></div>
            </div>
            <button class="btn-action" style="width:100%; justify-content:center" onclick="saveProduct()">حفظ</button>
            <button onclick="closeModal('productModal')" style="width:100%; background:none; border:none; color:#555; margin-top:10px; cursor:pointer;">إغلاق</button>
        </div>
    </div>

    <div id="print-area">
        <div id="pr-name" style="font-size: 10pt; font-weight: bold; margin-bottom: 2px;"></div>
        <svg id="pr-barcode"></svg>
        <div id="pr-price" style="font-size: 11pt; font-weight: bold; margin-top: 2px;"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');
        let allProducts = [];

        async function loadInventory() {
            const search = document.getElementById('main-search').value;
            let { data } = await _supabase.from('products').select('*').eq('store_key', storeKey);
            if(search) data = data.filter(p => p.product_name.includes(search) || (p.barcode && p.barcode.includes(search)));
            
            allProducts = data || [];
            const tbody = document.getElementById('inventory-table');
            const select = document.getElementById('order-product-select');
            
            tbody.innerHTML = '';
            select.innerHTML = '<option value="">-- اختر صنف --</option>';

            allProducts.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.product_name}</option>`;
                tbody.innerHTML += `
                    <tr>
                        <td><span class="barcode-pill">${p.barcode || 'N/A'}</span></td>
                        <td>${p.product_name}</td>
                        <td style="color:${p.stock <= 5 ? 'var(--red)' : 'var(--green)'}; font-weight:bold">${p.stock}</td>
                        <td>${p.cost_price || 0} ج.م</td>
                        <td>${p.price} ج.م</td>
                        <td>
                            <button onclick="printLabel('${p.barcode}','${p.product_name}','${p.price}')" style="background:none; border:none; cursor:pointer;">🖨️</button>
                            <button onclick="openEditModal('${p.id}')" style="background:none; border:none; color:#888; cursor:pointer; margin-right:10px;">⚙️</button>
                        </td>
                    </tr>`;
            });
        }

        async function submitOrder() {
            const id = document.getElementById('order-product-select').value;
            const qty = parseInt(document.getElementById('order-qty').value);
            if(!id || isNaN(qty)) return alert("اختر الصنف والكمية");

            const p = allProducts.find(x => x.id == id);
            await _supabase.from('products').update({ stock: p.stock + qty }).eq('id', id);
            alert("تمت الإضافة للمخزن");
            closeModal('orderModal');
            loadInventory();
        }

        async function exportToExcel() {
            const today = new Date().toLocaleDateString('ar-EG');
            const data = allProducts.map(p => ({
                "تاريخ الجرد": today,
                "الباركود": p.barcode,
                "اسم المنتج": p.product_name,
                "الكمية": p.stock,
                "سعر الشراء": p.cost_price,
                "سعر البيع": p.price,
                "إجمالي التكلفة": p.stock * (p.cost_price || 0)
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "جرد المخزن");
            XLSX.writeFile(wb, `جرد_المخزن_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        function printLabel(code, name, price) {
            if(!code) return alert("لا يوجد باركود");
            document.getElementById('pr-name').innerText = name;
            document.getElementById('pr-price').innerText = price + " ج.م";
            JsBarcode("#pr-barcode", code, { format: "CODE128", width: 2, height: 40, displayValue: true });
            window.print();
        }

        function openAddModal() {
            document.getElementById('edit-id').value = "";
            document.getElementById('p-barcode').value = Date.now();
            document.getElementById('productModal').style.display = 'flex';
        }

        function openEditModal(id) {
            const p = allProducts.find(x => x.id == id);
            document.getElementById('edit-id').value = p.id;
            document.getElementById('p-barcode').value = p.barcode;
            document.getElementById('p-name').value = p.product_name;
            document.getElementById('p-stock').value = p.stock;
            document.getElementById('p-cost').value = p.cost_price;
            document.getElementById('p-price').value = p.price;
            document.getElementById('productModal').style.display = 'flex';
        }

        async function saveProduct() {
            const data = {
                store_key: storeKey,
                barcode: document.getElementById('p-barcode').value,
                product_name: document.getElementById('p-name').value,
                stock: parseInt(document.getElementById('p-stock').value),
                cost_price: parseFloat(document.getElementById('p-cost').value),
                price: parseFloat(document.getElementById('p-price').value)
            };
            const id = document.getElementById('edit-id').value;
            if(id) await _supabase.from('products').update(data).eq('id', id);
            else await _supabase.from('products').insert([data]);
            closeModal('productModal'); loadInventory();
        }

        function openOrderModal() { document.getElementById('orderModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        loadInventory();
    </script>
</body>
</html>
