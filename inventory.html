<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المخزن - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #111; --accent: #00f2fe; --white: #fff; --gray: #1a1a1a; --red: #ff4d4d; --green: #00ff88; --orange: #ffa500; --purple: #8a2be2; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; transition: 0.3s; }
        body { background: var(--bg); color: var(--white); margin: 0; padding: 20px; }
        
        .header-section { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--gray); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .store-title { color: var(--accent); font-weight: 800; font-size: 28px; margin: 0; }
        
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-main { border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-main:hover { transform: translateY(-3px); }
        
        .btn-add { background: var(--accent); color: #000; }
        .btn-order { background: var(--green); color: #000; }
        .btn-export { background: var(--orange); color: #000; }
        .btn-backup { background: var(--purple); color: #fff; }
        .btn-import { background: #fff; color: #000; }

        /* بوكس النواقص */
        .shortage-box { background: rgba(255, 77, 77, 0.1); border: 1px solid var(--red); padding: 15px; border-radius: 15px; margin-bottom: 20px; display: none; }
        .shortage-title { color: var(--red); font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .shortage-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .shortage-item { background: var(--red); color: white; padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; }

        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { background: transparent; padding: 15px; text-align: right; color: var(--accent); font-size: 14px; }
        tr { background: var(--card); border-radius: 15px; }
        td { padding: 15px; border-top: 1px solid #222; border-bottom: 1px solid #222; }
        td:first-child { border-right: 1px solid #222; border-radius: 0 15px 15px 0; }
        td:last-child { border-left: 1px solid #222; border-radius: 15px 0 0 15px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #0a0a0a; padding: 30px; border-radius: 25px; border: 1px solid var(--accent); width: 450px; position: relative; }
        
        input, select { background: #111; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; width: 100%; margin-top: 8px; margin-bottom: 15px; }
        .action-icon { cursor: pointer; font-size: 18px; margin-left: 10px; opacity: 0.7; }
        .action-icon:hover { opacity: 1; transform: scale(1.2); }

        #print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 40mm; height: 30mm; display: flex !important; flex-direction: column; align-items: center; justify-content: center; background: white; color: black; }
        }
    </style>
</head>
<body>

    <div class="header-section">
        <div>
            <h1 id="store-name-display" class="store-title">Fateen OS</h1>
            <p style="color:#666; margin: 5px 0 0 0;">إدارة المخزون والتحكم في النواقص</p>
        </div>
        <div class="btn-group">
            <button class="btn-main btn-add" onclick="openAddModal()">✨ صنف جديد</button>
            <button class="btn-main btn-order" onclick="openOrderModal()">📦 توريد كمية</button>
            <button class="btn-main btn-export" onclick="exportToExcel()">📊 جرد المخزن (Excel)</button>
            <button class="btn-main btn-backup" onclick="exportBackup()">💾 Back-Up</button>
            <button class="btn-main btn-import" onclick="openImportChoice()">📥 Back-In</button>
            <button class="btn-main" style="background:#333; color:#fff" onclick="location.href='manager.html'">↩</button>
        </div>
    </div>

    <div id="shortage-box" class="shortage-box">
        <div class="shortage-title">⚠️ تنبيه النواقص (الأصناف المطلوبة)</div>
        <div id="shortage-list" class="shortage-list"></div>
    </div>

    <input type="text" id="main-search" placeholder="🔍 ابحث بالاسم أو الباركود..." oninput="loadInventory()" style="margin-bottom: 20px; font-size: 16px;">

    <table>
        <thead>
            <tr>
                <th>الباركود</th>
                <th>اسم المنتج</th>
                <th>المخزون</th>
                <th>التكلفة</th>
                <th>سعر البيع</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody id="inventory-table"></tbody>
    </table>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">بيانات الصنف</h2>
            <input type="hidden" id="edit-id">
            <label>الباركود (13 رقم)</label>
            <div style="display:flex; gap:5px">
                <input type="text" id="p-barcode">
                <button onclick="generateNumericBarcode()" style="height:48px; background:var(--gray); color:white; border-radius:10px; cursor:pointer; border:1px solid #333; padding:0 15px;">🎲</button>
            </div>
            <label>اسم الصنف</label>
            <input type="text" id="p-name">
            <div style="display: flex; gap: 10px;">
                <div style="flex:1"><label>الكمية</label><input type="number" id="p-stock"></div>
                <div style="flex:1"><label>تنبيه النواقص عند</label><input type="number" id="p-alert" placeholder="مثلاً 5"></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div style="flex:1"><label>الشراء</label><input type="number" id="p-cost"></div>
                <div style="flex:1"><label>البيع</label><input type="number" id="p-price"></div>
            </div>
            <button class="btn-main btn-add" style="width:100%; justify-content:center" onclick="saveProduct()">حفظ البيانات</button>
            <button onclick="closeModal('productModal')" style="margin-top:10px; width:100%; background:none; border:none; color:#555; cursor:pointer">إلغاء</button>
        </div>
    </div>

    <div id="importChoiceModal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <h3>نظام Back-In</h3>
            <button class="btn-main btn-backup" style="width:100%; justify-content:center; margin-bottom:10px" onclick="downloadTemplate()">تحميل النموذج</button>
            <button class="btn-main btn-import" style="width:100%; justify-content:center; border:1px solid #ddd" onclick="document.getElementById('importFile').click()">رفع الملف</button>
            <input type="file" id="importFile" hidden accept=".xlsx, .xls" onchange="importFromExcel(event)">
            <button onclick="closeModal('importChoiceModal')" style="margin-top:15px; background:none; border:none; color:#555; cursor:pointer">إغلاق</button>
        </div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--green)">📦 توريد كمية</h2>
            <select id="order-product-select"></select>
            <input type="number" id="order-qty" placeholder="الكمية">
            <button class="btn-main btn-order" style="width:100%; justify-content:center" onclick="submitOrder()">تأكيد</button>
            <button onclick="closeModal('orderModal')" style="margin-top:10px; width:100%; background:none; border:none; color:#555; cursor:pointer">إلغاء</button>
        </div>
    </div>

    <div id="print-area">
        <div id="pr-store"></div>
        <div id="pr-name"></div>
        <svg id="pr-barcode"></svg>
        <div id="pr-price"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');
        let storeName = "Fateen Store";
        let allProducts = [];

        async function init() {
            const { data: store } = await _supabase.from('stores').select('store_name').eq('store_key', storeKey).single();
            if(store) { storeName = store.store_name; document.getElementById('store-name-display').innerText = storeName; }
            loadInventory();
        }

        async function loadInventory() {
            const search = document.getElementById('main-search').value;
            let { data } = await _supabase.from('products').select('*').eq('store_key', storeKey).order('created_at', {ascending: false});
            if(search) data = data.filter(p => p.product_name.includes(search) || (p.barcode && p.barcode.includes(search)));
            allProducts = data || [];
            
            const tbody = document.getElementById('inventory-table');
            const shortageList = document.getElementById('shortage-list');
            const shortageBox = document.getElementById('shortage-box');
            const select = document.getElementById('order-product-select');
            
            tbody.innerHTML = '';
            shortageList.innerHTML = '';
            select.innerHTML = '<option value="">-- اختر صنف --</option>';
            let hasShortage = false;

            allProducts.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.product_name}</option>`;
                
                // فحص النواقص بناءً على الحد المحدد (الافتراضي 5 لو مش محدد)
                const limit = p.alert_limit || 5;
                if(p.stock <= limit) {
                    hasShortage = true;
                    shortageList.innerHTML += `<div class="shortage-item">${p.product_name} (${p.stock})</div>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td><span style="color:var(--accent)">${p.barcode || '---'}</span></td>
                        <td>${p.product_name}</td>
                        <td style="color:${p.stock <= limit ? 'var(--red)' : 'var(--green)'}; font-weight:800">${p.stock}</td>
                        <td>${p.cost_price || 0}</td>
                        <td>${p.price}</td>
                        <td>
                            <span class="action-icon" onclick="printLabel('${p.barcode}','${p.product_name}','${p.price}')">🖨️</span>
                            <span class="action-icon" onclick="openEditModal('${p.id}')">⚙️</span>
                            <span class="action-icon" style="color:var(--red)" onclick="deleteProduct('${p.id}')">🗑️</span>
                        </td>
                    </tr>`;
            });
            shortageBox.style.display = hasShortage ? 'block' : 'none';
        }

        async function exportToExcel() {
            const data = allProducts.map(p => ({ "الباركود": p.barcode, "الصنف": p.product_name, "الكمية": p.stock, "سعر الشراء": p.cost_price, "سعر البيع": p.price }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventory");
            XLSX.writeFile(wb, `جرد_${storeName}.xlsx`);
        }

        async function saveProduct() {
            const id = document.getElementById('edit-id').value;
            const data = {
                store_key: storeKey,
                barcode: document.getElementById('p-barcode').value,
                product_name: document.getElementById('p-name').value,
                stock: parseInt(document.getElementById('p-stock').value),
                cost_price: parseFloat(document.getElementById('p-cost').value),
                price: parseFloat(document.getElementById('p-price').value),
                alert_limit: parseInt(document.getElementById('p-alert').value) || 5
            };
            if(id) await _supabase.from('products').update(data).eq('id', id);
            else await _supabase.from('products').insert([data]);
            closeModal('productModal'); loadInventory();
        }

        function openEditModal(id) {
            const p = allProducts.find(x => x.id == id);
            document.getElementById('edit-id').value = p.id;
            document.getElementById('p-barcode').value = p.barcode;
            document.getElementById('p-name').value = p.product_name;
            document.getElementById('p-stock').value = p.stock;
            document.getElementById('p-cost').value = p.cost_price;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-alert').value = p.alert_limit || 5;
            document.getElementById('productModal').style.display = 'flex';
        }

        function generateNumericBarcode() {
            document.getElementById('p-barcode').value = "622" + Math.floor(1000000000 + Math.random() * 9000000000);
        }

        function downloadTemplate() {
            const data = [{"الباركود": "622000", "الصنف": "اسم المنتج", "الكمية": 10, "سعر الشراء": 50, "سعر البيع": 70, "حد التنبيه": 5}];
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Template");
            XLSX.writeFile(wb, "Template.xlsx");
        }

        function importFromExcel(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                for (let item of jsonData) {
                    await _supabase.from('products').insert([{
                        store_key: storeKey,
                        barcode: String(item["الباركود"] || Date.now()),
                        product_name: item["الصنف"],
                        stock: item["الكمية"],
                        cost_price: item["سعر الشراء"],
                        price: item["سعر البيع"],
                        alert_limit: item["حد التنبيه"] || 5
                    }]);
                }
                alert("تم الاستيراد"); loadInventory();
            };
            reader.readAsArrayBuffer(file);
        }

        // باقي الدوال (الحذف، التوريد، إغلاق المودال) كما هي
        async function submitOrder() {
            const id = document.getElementById('order-product-select').value;
            const qty = parseInt(document.getElementById('order-qty').value);
            const p = allProducts.find(x => x.id == id);
            await _supabase.from('products').update({ stock: p.stock + qty }).eq('id', id);
            closeModal('orderModal'); loadInventory();
        }
        async function deleteProduct(id) { if(confirm("حذف؟")) { await _supabase.from('products').delete().eq('id', id); loadInventory(); } }
        function openAddModal() { document.getElementById('edit-id').value = ""; document.getElementById('p-stock').value=0; generateNumericBarcode(); document.getElementById('productModal').style.display='flex'; }
        function openImportChoice() { document.getElementById('importChoiceModal').style.display='flex'; }
        function openOrderModal() { document.getElementById('orderModal').style.display='flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function exportBackup() { const ws = XLSX.utils.json_to_sheet(allProducts); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Backup"); XLSX.writeFile(wb, `Backup.xlsx`); }
        function printLabel(c,n,p) { document.getElementById('pr-store').innerText=storeName; document.getElementById('pr-name').innerText=n; document.getElementById('pr-price').innerText=p; JsBarcode("#pr-barcode",c,{height:40}); window.print(); }
        init();
    </script>
</body>
</html>
