<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المخزن الاحترافية - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #111; --accent: #00f2fe; --white: #fff; --gray: #1a1a1a; --red: #ff4d4d; --green: #00ff88; --orange: #ffa500; --purple: #8a2be2; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background: var(--bg); color: var(--white); margin: 0; padding: 20px; }
        
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--gray); padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .store-title { color: var(--accent); font-weight: 800; font-size: 24px; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action { background: var(--accent); color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
        
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; margin-top: 15px; }
        th { background: #1a1a1a; padding: 12px; text-align: right; color: var(--accent); border-bottom: 2px solid var(--accent); }
        td { padding: 12px; border-bottom: 1px solid #222; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #0a0a0a; padding: 25px; border-radius: 20px; border: 1px solid var(--accent); width: 400px; }
        
        input { background: #111; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; width: 100%; margin-top: 5px; margin-bottom: 10px; }
        
        #print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 40mm; height: 30mm; display: flex !important; flex-direction: column; align-items: center; justify-content: center; background: white; color: black; border: 1px solid #000; }
        }
    </style>
</head>
<body>

    <div class="header-section">
        <div>
            <div id="store-name-display" class="store-title">جاري التحميل...</div>
            <p style="margin:5px 0 0; color:#666">مركز التحكم في المخزون</p>
        </div>
        <div class="btn-group">
            <button class="btn-action" style="background:var(--purple)" onclick="exportBackup()">💾 Back-Up (Excel)</button>
            <button class="btn-action" style="background:var(--orange)" onclick="document.getElementById('importFile').click()">📥 Back-In (Excel)</button>
            <input type="file" id="importFile" hidden accept=".xlsx, .xls" onchange="importFromExcel(event)">
            <button class="btn-action" style="background:var(--green)" onclick="askExportFormat()">📊 جرد المخزن</button>
            <button class="btn-action" onclick="openAddModal()">+ صنف جديد</button>
            <button class="btn-action" style="background:#fff" onclick="location.href='manager.html'">↩</button>
        </div>
    </div>

    <input type="text" id="main-search" placeholder="بحث بالاسم أو الباركود..." oninput="loadInventory()">

    <table>
        <thead>
            <tr>
                <th>الباركود</th>
                <th>المنتج</th>
                <th>المخزون</th>
                <th>التكلفة</th>
                <th>البيع</th>
                <th>تحكم</th>
            </tr>
        </thead>
        <tbody id="inventory-table"></tbody>
    </table>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top:0">بيانات الصنف</h2>
            <input type="hidden" id="edit-id">
            <label>الباركود (أرقام فقط)</label>
            <div style="display:flex; gap:5px">
                <input type="text" id="p-barcode" placeholder="622xxxx...">
                <button onclick="generateNumericBarcode()" style="height:40px; background:var(--gray); color:white; border-radius:8px; cursor:pointer; border:1px solid #333; padding:0 10px;">🎲</button>
            </div>
            <label>اسم الصنف</label>
            <input type="text" id="p-name">
            <div style="display: flex; gap: 10px;">
                <div style="flex:1"><label>الكمية</label><input type="number" id="p-stock"></div>
                <div style="flex:1"><label>الشراء</label><input type="number" id="p-cost"></div>
                <div style="flex:1"><label>البيع</label><input type="number" id="p-price"></div>
            </div>
            <button class="btn-action" style="width:100%; justify-content:center" onclick="saveProduct()">حفظ</button>
            <button onclick="closeModal('productModal')" style="width:100%; background:none; border:none; color:#555; margin-top:10px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <div id="print-area">
        <div id="pr-store" style="font-size: 8pt; font-weight: bold;"></div>
        <div id="pr-name" style="font-size: 9pt; font-weight: bold;"></div>
        <svg id="pr-barcode"></svg>
        <div id="pr-price" style="font-size: 11pt; font-weight: 900;"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');
        let storeName = "Fateen Store";
        let allProducts = [];

        async function init() {
            const { data: store } = await _supabase.from('stores').select('store_name').eq('store_key', storeKey).single();
            if(store) { storeName = store.store_name; document.getElementById('store-name-display').innerText = storeName; }
            loadInventory();
        }

        async function loadInventory() {
            const search = document.getElementById('main-search').value;
            let { data } = await _supabase.from('products').select('*').eq('store_key', storeKey);
            if(search) data = data.filter(p => p.product_name.includes(search) || (p.barcode && p.barcode.includes(search)));
            allProducts = data || [];
            const tbody = document.getElementById('inventory-table');
            tbody.innerHTML = allProducts.map(p => `
                <tr>
                    <td><span style="font-family:monospace; color:var(--accent)">${p.barcode || ''}</span></td>
                    <td>${p.product_name}</td>
                    <td style="color:${p.stock <= 5 ? 'var(--red)' : 'var(--green)'}; font-weight:bold">${p.stock}</td>
                    <td>${p.cost_price || 0}</td>
                    <td>${p.price}</td>
                    <td><button onclick="printLabel('${p.barcode}','${p.product_name}','${p.price}')" style="background:none; border:none; cursor:pointer;">🖨️</button></td>
                </tr>
            `).join('');
        }

        // باركود أرقام فقط 13 رقم
        function generateNumericBarcode() {
            let code = "622" + Math.floor(1000000000 + Math.random() * 9000000000);
            document.getElementById('p-barcode').value = code;
        }

        function askExportFormat() {
            const choice = confirm("موافق لتنزيل الجرد Excel\nإلغاء لتنزيل الجرد PDF");
            if (choice) exportToExcel(); else exportToPDF();
        }

        async function exportToExcel() {
            let totalVal = 0;
            const data = allProducts.map(p => {
                totalVal += (p.stock * p.price);
                return { "الباركود": p.barcode, "الصنف": p.product_name, "الكمية": p.stock, "سعر الشراء": p.cost_price, "سعر البيع": p.price, "إجمالي القيمة": p.stock * p.price };
            });
            data.push({}, { "الصنف": "المجموع الكلي", "إجمالي القيمة": totalVal });
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventory");
            XLSX.writeFile(wb, `جرد_${storeName}.xlsx`);
        }

        async function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text(`Inventory Report - ${storeName}`, 10, 10);
            const body = allProducts.map(p => [p.barcode, p.product_name, p.stock, p.price]);
            doc.autoTable({ head: [['Barcode', 'Product', 'Stock', 'Price']], body: body });
            doc.save(`جرد_${storeName}.pdf`);
        }

        async function exportBackup() {
            const ws = XLSX.utils.json_to_sheet(allProducts);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Backup");
            XLSX.writeFile(wb, `Backup_${storeName}_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        function importFromExcel(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                alert(`جاري رفع ${jsonData.length} صنف...`);
                for (let item of jsonData) {
                    const row = {
                        store_key: storeKey,
                        barcode: item["الباركود"] || item["barcode"] || String(Date.now()),
                        product_name: item["الصنف"] || item["product_name"] || "بدون اسم",
                        stock: parseInt(item["الكمية"] || item["stock"] || 0),
                        cost_price: parseFloat(item["سعر الشراء"] || item["cost_price"] || 0),
                        price: parseFloat(item["سعر البيع"] || item["price"] || 0)
                    };
                    await _supabase.from('products').insert([row]);
                }
                alert("✅ تم تحديث البيانات بنجاح");
                loadInventory();
            };
            reader.readAsArrayBuffer(file);
        }

        function printLabel(code, name, price) {
            document.getElementById('pr-store').innerText = storeName;
            document.getElementById('pr-name').innerText = name;
            document.getElementById('pr-price').innerText = price + " ج.م";
            JsBarcode("#pr-barcode", code, { format: "CODE128", width: 2, height: 40, displayValue: true });
            window.print();
        }

        function openAddModal() {
            document.getElementById('edit-id').value = "";
            document.getElementById('p-name').value = "";
            generateNumericBarcode();
            document.getElementById('productModal').style.display = 'flex';
        }

        async function saveProduct() {
            const data = {
                store_key: storeKey,
                barcode: document.getElementById('p-barcode').value,
                product_name: document.getElementById('p-name').value,
                stock: parseInt(document.getElementById('p-stock').value),
                cost_price: parseFloat(document.getElementById('p-cost').value),
                price: parseFloat(document.getElementById('p-price').value)
            };
            await _supabase.from('products').insert([data]);
            closeModal('productModal'); loadInventory();
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        init();
    </script>
</body>
</html>
