[package]
name = "fateen-pos"
version = "1.0.0"
description = "Fateen POS — Offline-first Arabic Point of Sale"
authors = ["Fateen POS Team"]
edition = "2021"

[lib]
name = "fateen_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fateen-pos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
