name: Build Windows EXE

on:
  push:
    branches:
      - main
      - 'copilot/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop/electron

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/electron/package.json

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer & portable EXE
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fateen-pos-windows-installer
          path: dist-desktop/*.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fateen-pos-windows-portable
          path: dist-desktop/*portable*.exe
          retention-days: 30
          if-no-files-found: warn
