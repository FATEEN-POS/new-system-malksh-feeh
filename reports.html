<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مركز التقارير الذكي - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root { --bg: #050505; --card: #111; --accent: #00f2fe; --gray: #222; --red: #ff4d4d; --green: #00ff88; --orange: #ffa500; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; transition: 0.3s; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 280px; background: var(--card); border-left: 1px solid var(--gray); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .nav-btn { background: none; border: 1px solid var(--gray); color: #888; padding: 12px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; text-align: right; width: 100%; font-size: 14px; }
        .nav-btn:hover, .nav-btn.active { border-color: var(--accent); color: #fff; background: rgba(0, 242, 254, 0.05); }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .report-section { display: none; }
        .report-section.active { display: block; animation: fadeIn 0.3s; }

        .filter-bar { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; border: 1px solid var(--gray); }
        input[type="date"] { background: #000; color: var(--accent); border: 1px solid var(--gray); padding: 8px; border-radius: 8px; outline: none; }

        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-box { background: var(--card); border: 1px solid var(--gray); padding: 20px; border-radius: 15px; text-align: center; border-bottom: 3px solid var(--gray); }
        .stat-box p { margin: 10px 0 0; font-size: 22px; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 15px; overflow: hidden; }
        th { background: #1a1a1a; color: var(--accent); padding: 12px; text-align: right; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid var(--gray); font-size: 13px; }
        tr:hover { background: rgba(255, 255, 255, 0.02); cursor: pointer; }

        .btn-accent { background: var(--accent); color: #000; border: none; padding: 8px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-red { background: var(--red); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color:var(--accent); text-align:center; font-weight: 800;">FATEEN REPORTS</h2>
        <button class="nav-btn active" onclick="showSection('daily')">📅 ملخص المبيعات</button>
        <button class="nav-btn" onclick="showSection('periods')">⏳ فترات المبيعات</button>
        <button class="nav-btn" onclick="showSection('performance')">🏆 أداء الموظفين</button>
        <button class="nav-btn" onclick="showSection('products')">📦 مراقبة المخزن</button>
        <div style="flex:1"></div>
        <button class="nav-btn" style="border-color:var(--red); color:var(--red);" onclick="location.href='manager.html'">الرجوع للإدارة</button>
    </div>

    <div class="main-content">
        <div id="daily" class="report-section active">
            <div class="filter-bar">
                <h3 style="margin:0; flex:1">العمليات</h3>
                <input type="date" id="d-start"> <span>إلى</span> <input type="date" id="d-end">
                <button class="btn-accent" onclick="loadDaily()">تحديث</button>
            </div>
            <div class="grid-stats">
                <div class="stat-box" style="border-bottom-color:var(--accent)"><h4>إجمالي البيع</h4><p id="d-total">0</p></div>
                <div class="stat-box" style="border-bottom-color:var(--green)"><h4>طرق الدفع</h4><p id="d-payment-stat" style="font-size:14px; color:#aaa">0</p></div>
                <div class="stat-box" style="border-bottom-color:var(--red)"><h4>المرتجعات</h4><p id="d-return">0</p></div>
            </div>
            <table>
                <thead><tr><th>رقم العملية</th><th>التاريخ</th><th>البائع</th><th>القيمة</th><th>الحالة</th></tr></thead>
                <tbody id="daily-body"></tbody>
            </table>
        </div>

        <div id="performance" class="report-section">
            <div class="filter-bar">
                <h3 style="margin:0; flex:1">كفاءة الفريق</h3>
                <input type="date" id="perf-start"> <span>إلى</span> <input type="date" id="perf-end">
                <button class="btn-accent" onclick="loadPerformance()">تطبيق</button>
            </div>
            <table>
                <thead><tr><th>الموظف</th><th>العمليات</th><th>المبيعات</th><th>المتوسط</th></tr></thead>
                <tbody id="perf-body"></tbody>
            </table>
        </div>

        <div id="periods" class="report-section">
            <div class="filter-bar">
                <input type="date" id="p-start"> <span>إلى</span> <input type="date" id="p-end">
                <button class="btn-accent" onclick="loadPeriodReport()">تحليل بياني</button>
            </div>
            <div id="period-stats-container" style="display:none">
                <div class="chart-container" style="height: 300px;"><canvas id="periodChart"></canvas></div>
            </div>
        </div>

        <div id="products" class="report-section">
            <div class="filter-bar">
                <input type="date" id="prod-start"> <span>إلى</span> <input type="date" id="prod-end">
                <button class="btn-accent" onclick="loadProductStats()">تحديث</button>
            </div>
            <table id="prod-table">
                <thead><tr><th>الصنف</th><th>المخزون</th><th>المباع</th><th>الدخل</th></tr></thead>
                <tbody id="prod-body"></tbody>
            </table>
        </div>
    </div>

    <div id="receiptModal" class="modal">
        <div class="modal-content" style="background:var(--card); padding:25px; border-radius:20px; border:1px solid var(--accent); width:400px;">
            <div id="receipt-details"></div>
            <div id="return-button-container"></div>
            <button class="nav-btn" style="width:100%; margin-top:10px" onclick="document.getElementById('receiptModal').style.display='none'">إغلاق</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');
        let myChart;

        function setDefaultDates() {
            const today = new Date().toISOString().split('T')[0];
            ['d-start', 'd-end', 'p-start', 'p-end', 'perf-start', 'perf-end', 'prod-start', 'prod-end'].forEach(id => {
                if(document.getElementById(id)) document.getElementById(id).value = today;
            });
        }

        function showSection(id) {
            document.querySelectorAll('.report-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'daily') loadDaily();
            if(id === 'performance') loadPerformance();
        }

        async function loadDaily() {
            const start = document.getElementById('d-start').value;
            const end = document.getElementById('d-end').value;
            const { data, error } = await _supabase.from('sales').select('*').eq('store_key', storeKey).gte('created_at', start+'T00:00:00').lte('created_at', end+'T23:59:59').order('created_at', {ascending:false});
            
            let total = 0, ret = 0, cash = 0, visa = 0;
            const body = document.getElementById('daily-body');
            body.innerHTML = data?.map(s => {
                const amount = parseFloat(s.total_amount) || 0;
                const isReturn = s.type === 'return';
                
                if(!isReturn) {
                    total += amount;
                    if(s.payment_method === 'فيزا' || s.payment_method === 'visa') visa += amount;
                    else cash += amount;
                } else {
                    ret += amount;
                }

                return `<tr onclick='openReceipt(${JSON.stringify(s)})'>
                    <td>#${s.id.toString().slice(-6)}</td>
                    <td>${new Date(s.created_at).toLocaleString('ar-EG')}</td>
                    <td>${s.seller_name}</td>
                    <td>${amount} ج.م</td>
                    <td style="color:${isReturn ? 'var(--red)' : 'var(--green)'}">${isReturn ? 'مرتجع' : 'بيع'}</td>
                </tr>`;
            }).join('') || '';

            document.getElementById('d-total').innerText = total.toLocaleString() + " ج.م";
            document.getElementById('d-return').innerText = ret.toLocaleString() + " ج.م";
            document.getElementById('d-payment-stat').innerText = `كاش: ${cash} | فيزا: ${visa}`;
        }

        async function loadPerformance() {
            const start = document.getElementById('perf-start').value;
            const end = document.getElementById('perf-end').value;
            const { data } = await _supabase.from('sales').select('*').eq('store_key', storeKey).eq('type', 'sale').gte('created_at', start+'T00:00:00').lte('created_at', end+'T23:59:59');
            
            const stats = {};
            data?.forEach(s => {
                if(!stats[s.seller_name]) stats[s.seller_name] = { count: 0, total: 0 };
                stats[s.seller_name].count++;
                stats[s.seller_name].total += parseFloat(s.total_amount) || 0;
            });

            document.getElementById('perf-body').innerHTML = Object.keys(stats).map(name => `
                <tr>
                    <td>${name}</td>
                    <td>${stats[name].count}</td>
                    <td>${stats[name].total.toLocaleString()} ج.م</td>
                    <td>${(stats[name].total / stats[name].count || 0).toFixed(2)} ج.م</td>
                </tr>`).join('');
        }

        function openReceipt(sale) {
            const details = document.getElementById('receipt-details');
            const btnContainer = document.getElementById('return-button-container');
            
            details.innerHTML = `
                <h3 style="text-align:center; color:var(--accent)">فاتورة #${sale.id.toString().slice(-6)}</h3>
                <p>البائع: ${sale.seller_name}</p>
                <div style="border-top:1px dashed #444; padding:10px 0">
                    ${sale.items.map(i => `<div style="display:flex; justify-content:space-between"><span>${i.product_name} (x${i.qty})</span><span>${i.price * i.qty} ج.م</span></div>`).join('')}
                </div>
                <h2 style="text-align:center; color:var(--green)">${sale.total_amount} ج.م</h2>`;
            
            btnContainer.innerHTML = sale.type !== 'return' ? 
                `<button class="btn-red" onclick="processReturn(${sale.id})">إرجاع الفاتورة بالكامل</button>` : 
                `<p style="color:var(--red); text-align:center">هذه العملية تم إرجاعها</p>`;
            
            document.getElementById('receiptModal').style.display = 'flex';
        }

        async function processReturn(id) {
            if(!confirm("سيتم تحويل الفاتورة لمرتجع وإعادة الكميات للمخزن. استمرار؟")) return;
            
            try {
                const { data: sale, error: fErr } = await _supabase.from('sales').select('*').eq('id', id).single();
                if(fErr) throw fErr;

                // 1. تحديث الحالة
                const { error: uErr } = await _supabase.from('sales').update({ type: 'return' }).eq('id', id);
                if(uErr) throw uErr;

                // 2. تحديث المخزن
                for(let item of sale.items) {
                    const { data: p } = await _supabase.from('products').select('stock').eq('id', item.id).single();
                    if(p) await _supabase.from('products').update({ stock: (Number(p.stock) + Number(item.qty)) }).eq('id', item.id);
                }

                alert("✅ تم الإرجاع بنجاح");
                document.getElementById('receiptModal').style.display = 'none';
                loadDaily();
            } catch (e) {
                alert("خطأ: " + e.message);
                console.error(e);
            }
        }

        // تشغيل افتراضي
        setDefaultDates();
        loadDaily();
    </script>
</body>
</html>
