<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مركز التقارير - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root { --bg: #050505; --card: #111; --accent: #00f2fe; --gray: #222; --red: #ff4d4d; --green: #00ff88; --visa: #ffca28; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--card); border-left: 1px solid var(--gray); padding: 20px; display: flex; flex-direction: column; flex-shrink: 0; }
        .nav-btn { background: none; border: none; color: #888; padding: 15px; text-align: right; cursor: pointer; border-radius: 10px; margin-bottom: 5px; font-weight: bold; }
        .nav-btn.active { background: rgba(0,242,254,0.1); color: var(--accent); border-right: 3px solid var(--accent); }
        
        .main-content { flex: 1; padding: 25px; overflow-y: auto; }
        
        /* كروت الإحصائيات الجديدة */
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--gray); text-align: center; }
        .stat-card h3 { margin: 0; font-size: 14px; color: #888; }
        .stat-card p { margin: 10px 0 0; font-size: 20px; font-weight: 800; }

        .filter-bar { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border: 1px solid var(--gray); }
        input, select { background: #1a1a1a; border: 1px solid var(--gray); color: #fff; padding: 10px; border-radius: 8px; outline: none; }
        
        .table-container { background: var(--card); border-radius: 12px; border: 1px solid var(--gray); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid var(--gray); }
        th { background: rgba(255,255,255,0.05); color: var(--accent); }
        
        .row-return { background: rgba(255, 77, 77, 0.05); } /* تمييز سطر المرتجع */
        .badge { padding: 4px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .badge-sale { background: var(--green); color: #000; }
        .badge-return { background: var(--red); color: #fff; }

        .export-btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color:var(--accent)">التقارير</h2>
        <button class="nav-btn active" onclick="showSection('sales', this)">📊 تقرير العمليات</button>
        <button class="nav-btn" onclick="showSection('performance', this)">👤 أداء الموظفين</button>
        <button class="nav-btn" onclick="showSection('suppliers', this)">🚚 الموردين والديون</button>
        <button class="nav-btn" onclick="location.href='manager.html'" style="margin-top:auto; color:var(--red)">↩️ رجوع</button>
    </div>

    <div class="main-content">
        <div id="sales-section" class="section">
            <div class="stats-container">
                <div class="stat-card"><h3>إجمالي المبيعات (بدون المرتجع)</h3><p id="stat-total" style="color:var(--green)">0 ج.م</p></div>
                <div class="stat-card"><h3>كاش 💵</h3><p id="stat-cash" style="color:#fff">0 ج.م</p></div>
                <div class="stat-card"><h3>فيزا 💳</h3><p id="stat-visa" style="color:var(--visa)">0 ج.م</p></div>
                <div class="stat-card"><h3>مرتجع ↩️</h3><p id="stat-returns" style="color:var(--red)">0 ج.م</p></div>
            </div>

            <div class="filter-bar">
                <input type="date" id="sale-from"> <span>إلى</span> <input type="date" id="sale-to">
                <input type="text" id="search-invoice" placeholder="رقم الفاتورة..." oninput="loadSalesReport()">
                <button class="export-btn" onclick="loadSalesReport()">تحديث</button>
                <button class="export-btn" style="background:#fff" onclick="askExport('sales-table', 'تقرير_العمليات')">تحميل</button>
            </div>

            <div class="table-container">
                <table id="sales-table">
                    <thead><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>النوع</th><th>الوسيلة</th><th>البائع</th><th>المبلغ</th><th>إجراء</th></tr></thead>
                    <tbody id="sales-body"></tbody>
                </table>
            </div>
        </div>

        </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');

        async function init() {
            if(!storeKey) return location.href='index.html';
            loadSalesReport();
        }

        async function loadSalesReport() {
            const from = document.getElementById('sale-from').value;
            const to = document.getElementById('sale-to').value;
            const search = document.getElementById('search-invoice').value;

            let query = _supabase.from('sales').select('*').eq('store_key', storeKey).order('created_at', {ascending: false});
            if(from) query = query.gte('created_at', from);
            if(to) query = query.lte('created_at', to + 'T23:59:59');

            const { data: sales } = await query;
            const body = document.getElementById('sales-body');
            body.innerHTML = '';

            let total = 0, cash = 0, visa = 0, returns = 0;

            sales?.filter(s => s.id.toString().includes(search)).forEach(s => {
                const isReturn = s.type === 'return';
                const method = s.payment_method === 'visa' ? 'فيزا 💳' : 'كاش 💵';
                
                // حساب الإحصائيات
                if(isReturn) {
                    returns += s.total_amount;
                } else {
                    total += s.total_amount;
                    if(s.payment_method === 'visa') visa += s.total_amount;
                    else cash += s.total_amount;
                }

                body.innerHTML += `
                    <tr class="${isReturn ? 'row-return' : ''}">
                        <td>#${s.id.toString().slice(-6)}</td>
                        <td>${new Date(s.created_at).toLocaleDateString('ar-EG')}</td>
                        <td><span class="badge ${isReturn ? 'badge-return' : 'badge-sale'}">${isReturn ? 'إرجاع ↩️' : 'بيع ✅'}</span></td>
                        <td>${method}</td>
                        <td>${s.seller_name}</td>
                        <td style="font-weight:bold; color:${isReturn ? 'var(--red)' : '#fff'}">${s.total_amount.toLocaleString()} ج.م</td>
                        <td><button style="background:var(--red); border:none; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;" onclick="window.location.href='pos.html?returnId=${s.id}'">إرجاع</button></td>
                    </tr>
                `;
            });

            // تحديث كروت الأرقام
            document.getElementById('stat-total').innerText = total.toLocaleString() + " ج.م";
            document.getElementById('stat-cash').innerText = cash.toLocaleString() + " ج.م";
            document.getElementById('stat-visa').innerText = visa.toLocaleString() + " ج.م";
            document.getElementById('stat-returns').innerText = returns.toLocaleString() + " ج.م";
        }

        function askExport(tableId, name) {
            const choice = confirm("تحميل Excel؟ (موافق) | تحميل PDF؟ (إلغاء)");
            if(choice) {
                const table = document.getElementById(tableId);
                const wb = XLSX.utils.table_to_book(table);
                XLSX.writeFile(wb, `${name}.xlsx`);
            } else {
                const element = document.getElementById(tableId);
                html2pdf().from(element).set({ margin: 10, filename: `${name}.pdf`, html2canvas: { scale: 2, backgroundColor: '#111' } }).save();
            }
        }

        function showSection(sec, btn) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(sec + '-section').style.display = 'block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        init();
    </script>
</body>
</html>
