<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Fateen OS | Reports Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #111; --accent: #00f2fe; --gray: #222; --red: #ff4d4d; --green: #00ff88; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; transition: 0.3s; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* القائمة الجانبية */
        .sidebar { width: 260px; background: var(--card); border-left: 1px solid var(--gray); display: flex; flex-direction: column; padding: 20px; }
        .sidebar-header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--gray); padding-bottom: 15px; }
        #display-store-name { color: var(--accent); font-size: 18px; margin: 0; }
        #display-sys-v { font-size: 10px; color: #555; display: block; margin-top: 5px; }
        
        .nav-btn { background: none; border: none; color: #888; padding: 12px; text-align: right; cursor: pointer; border-radius: 10px; margin-bottom: 5px; font-weight: bold; font-size: 14px; width: 100%; }
        .nav-btn:hover, .nav-btn.active { background: rgba(0,242,254,0.1); color: var(--accent); }

        /* المحتوى الرئيسي */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s; }

        .report-section { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--gray); margin-top: 15px; position: relative; }
        .download-btn { position: absolute; top: 20px; left: 20px; background: #fff; color: #000; border: none; padding: 5px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .download-btn:hover { background: var(--accent); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-mini { background: #000; padding: 15px; border-radius: 12px; border: 1px solid var(--gray); border-right: 4px solid var(--accent); }
        .stat-mini span { display: block; color: #888; font-size: 11px; }
        .stat-mini strong { font-size: 18px; color: #fff; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: right; color: var(--accent); padding: 12px; border-bottom: 1px solid var(--gray); font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; }

        /* النافذة المنبثقة للمشتريات */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--accent); width: 400px; }
        .modal-content input { width: 100%; background: #000; border: 1px solid var(--gray); color: #fff; padding: 12px; margin-bottom: 15px; border-radius: 10px; outline: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2 id="display-store-name">جاري التحميل...</h2>
            <span id="display-sys-v">V 0.0.0</span>
        </div>
        <button class="nav-btn active" onclick="showTab('profit-tab', this)">💰 تقرير الأرباح</button>
        <button class="nav-btn" onclick="showTab('inventory-tab', this)">📦 تقرير المخزن</button>
        <button class="nav-btn" onclick="showTab('staff-tab', this)">👥 تقرير الموظفين</button>
        <button class="nav-btn" onclick="showTab('vendors-tab', this)">🚚 ديون الموردين</button>
        <hr style="width:100%; border:0; border-top:1px solid var(--gray); margin: 20px 0;">
        <button class="nav-btn" onclick="location.href='manager.html'" style="color:var(--red)">↩ العودة للمدير</button>
    </div>

    <div class="main-content">
        <div id="profit-tab" class="tab-content active">
            <h2>تحليل الأرباح والنمو</h2>
            <div class="report-section" id="profit-report-pdf">
                <button class="download-btn" onclick="downloadPDF('profit-report-pdf', 'Profit_Report')">📥 تحميل PDF</button>
                <div class="stats-grid">
                    <div class="stat-mini"><span>صافي الربح</span><strong>0.00 ج.م</strong></div>
                    <div class="stat-mini"><span>أعلى يوم مبيعاً</span><strong>الاثنين</strong></div>
                </div>
                <div style="height: 300px;"><canvas id="profitChart"></canvas></div>
            </div>
        </div>

        <div id="vendors-tab" class="tab-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>مستحقات الموردين</h2>
                <button onclick="openModal()" style="background:var(--accent); color:#000; border:none; padding:10px 20px; border-radius:10px; font-weight:bold; cursor:pointer;">+ فاتورة مشتريات آجلة</button>
            </div>
            <div class="report-section" id="vendors-report-pdf">
                <button class="download-btn" onclick="downloadPDF('vendors-report-pdf', 'Vendors_Debt_Report')">📥 تحميل PDF</button>
                <table>
                    <thead>
                        <tr><th>اسم المورد</th><th>إجمالي المديونية</th><th>آخر حركة</th><th>الحالة</th></tr>
                    </thead>
                    <tbody id="vendor-table-body">
                        </tbody>
                </table>
            </div>
        </div>

        </div>

    <div id="vendorModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:var(--accent);">تسجيل فاتورة آجلة</h3>
            <input type="text" id="v-name" placeholder="اسم المورد">
            <input type="number" id="v-amount" placeholder="قيمة الفاتورة">
            <button onclick="saveVendorInvoice()" style="width:100%; background:var(--accent); border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">حفظ الفاتورة</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#888; margin-top:10px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const userStoreKey = sessionStorage.getItem('store_key');

        async function initPage() {
            if (!userStoreKey) return location.href = 'index.html';

            // 1. جلب اسم المتجر وبياناته
            const { data: store } = await _supabase.from('stores').select('store_name').eq('store_key', userStoreKey).single();
            if (store) document.getElementById('display-store-name').innerText = "متجر " + store.store_name;

            // 2. جلب نسخة النظام
            const { data: vData } = await _supabase.from('system_settings').select('value').eq('key', 'sys_version').single();
            if (vData) document.getElementById('display-sys-v').innerText = "V " + vData.value;

            loadVendors();
            renderProfitChart();
        }

        // دالة تحميل PDF احترافية
        function downloadPDF(elementId, fileName) {
            const element = document.getElementById(elementId);
            const btn = element.querySelector('.download-btn');
            btn.style.display = 'none'; // إخفاء الزر أثناء التحميل

            const opt = {
                margin: 0.5,
                filename: fileName + '.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, backgroundColor: '#111' },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                btn.style.display = 'block'; // إعادة إظهار الزر
            });
        }

        // إدارة الموردين
        function openModal() { document.getElementById('vendorModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('vendorModal').style.display = 'none'; }

        async function saveVendorInvoice() {
            const name = document.getElementById('v-name').value;
            const amount = parseFloat(document.getElementById('v-amount').value);
            if (!name || !amount) return alert("يرجى إدخال البيانات كاملة");

            // البحث عن المورد أو تحديثه
            const { data: existing } = await _supabase.from('vendors').select('*').eq('vendor_name', name).eq('store_key', userStoreKey).single();

            if (existing) {
                await _supabase.from('vendors').update({ 
                    total_debt: existing.total_debt + amount, 
                    last_payment_date: new Date() 
                }).eq('id', existing.id);
            } else {
                await _supabase.from('vendors').insert([{ 
                    store_key: userStoreKey, 
                    vendor_name: name, 
                    total_debt: amount, 
                    last_payment_date: new Date() 
                }]);
            }
            
            alert("تم تسجيل الفاتورة بنجاح");
            closeModal();
            loadVendors();
        }

        async function loadVendors() {
            const { data } = await _supabase.from('vendors').select('*').eq('store_key', userStoreKey);
            const tbody = document.getElementById('vendor-table-body');
            tbody.innerHTML = data ? data.map(v => `
                <tr>
                    <td>${v.vendor_name}</td>
                    <td style="color:var(--red); font-weight:bold;">${v.total_debt.toFixed(2)} ج.م</td>
                    <td>${new Date(v.last_payment_date).toLocaleDateString('ar-EG')}</td>
                    <td><span style="color:var(--red)">🔴 مستحق</span></td>
                </tr>
            `).join('') : '<tr><td colspan="4">لا يوجد موردين مسجلين</td></tr>';
        }

        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function renderProfitChart() {
            const ctx = document.getElementById('profitChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'],
                    datasets: [{
                        label: 'الربح اليومي',
                        data: [500, 800, 1200, 900, 1500, 2000, 1800],
                        borderColor: '#00f2fe',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(0, 242, 254, 0.1)'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        initPage();
    </script>
</body>
</html>
