<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مركز التقارير الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root { --bg: #050505; --card: #111; --accent: #00f2fe; --gray: #222; --red: #ff4d4d; --green: #00ff88; --visa: #ffca28; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--card); border-left: 1px solid var(--gray); padding: 20px; display: flex; flex-direction: column; flex-shrink: 0; }
        .nav-btn { background: none; border: none; color: #888; padding: 15px; text-align: right; cursor: pointer; border-radius: 10px; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .nav-btn.active { background: rgba(0,242,254,0.1); color: var(--accent); border-right: 3px solid var(--accent); }
        
        .main-content { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--gray); text-align: center; }
        .stat-card h3 { margin: 0; font-size: 14px; color: #888; }
        .stat-card p { margin: 10px 0 0; font-size: 20px; font-weight: 800; color: var(--accent); }

        .filter-bar { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border: 1px solid var(--gray); }
        input, select { background: #1a1a1a; border: 1px solid var(--gray); color: #fff; padding: 10px; border-radius: 8px; outline: none; }
        
        .table-container { background: var(--card); border-radius: 12px; border: 1px solid var(--gray); overflow-x: auto; width: 100%; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid var(--gray); }
        th { background: rgba(255,255,255,0.05); color: var(--accent); font-weight: 700; }
        tr.sale-row:hover { background: rgba(255,255,255,0.02); }
        
        .btn-action { background: var(--red); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 2px; }
        .export-btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid var(--accent); width: 500px; max-height: 80vh; overflow-y: auto; }

        .badge { padding: 4px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .badge-sale { background: rgba(0, 255, 136, 0.1); color: var(--green); }
        .badge-return { background: rgba(255, 77, 77, 0.1); color: var(--red); }

        .details-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

    <div id="export-modal" class="modal">
        <div class="modal-content" style="width: 350px; text-align: center;">
            <h3 style="color:var(--accent); margin-bottom: 20px;">اختر صيغة التحميل</h3>
            <button class="export-btn" style="width: 100%; margin-bottom: 10px; background: var(--green);" onclick="processExport('excel')">تحميل ملف Excel 📊</button>
            <button class="export-btn" style="width: 100%; margin-bottom: 10px; background: var(--red); color: white;" onclick="processExport('pdf')">تحميل ملف PDF 📄</button>
            <button class="btn-action" style="width: 100%; background: #444;" onclick="closeModal('export-modal')">إلغاء</button>
        </div>
    </div>

    <div id="details-modal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--accent); text-align:center;">تفاصيل الفاتورة</h3>
            <div id="invoice-info" style="margin-bottom: 20px; border-bottom: 1px solid var(--accent); padding-bottom: 10px;"></div>
            <div id="items-list"></div>
            <div id="invoice-total" style="margin-top: 20px; text-align: center; font-size: 20px; font-weight: bold;"></div>
            <button class="btn-action" onclick="closeModal('details-modal')" style="width:100%; margin-top:20px; background: #333;">إغلاق</button>
        </div>
    </div>

    <div id="supplier-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="color:var(--accent)">إضافة مورد جديد</h3>
            <input type="hidden" id="sup-id">
            <input type="text" id="sup-name" placeholder="اسم المورد">
            <input type="number" id="sup-total" placeholder="إجمالي المسحوبات (القيمة)">
            <input type="number" id="sup-paid" placeholder="المبلغ المدفوع">
            <div style="display:flex; gap:10px">
                <button class="export-btn" onclick="saveSupplier()" style="flex:1">حفظ</button>
                <button class="btn-action" onclick="closeModal('supplier-modal')" style="flex:1">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <h2 style="color:var(--accent); margin-bottom: 20px;">Fateen OS</h2>
        <button class="nav-btn active" onclick="showSection('sales', this)">📊 تقرير العمليات</button>
        <button class="nav-btn" onclick="showSection('performance', this)">👤 أداء الموظفين</button>
        <button class="nav-btn" onclick="showSection('suppliers', this)">🚚 الموردين والديون</button>
        <button class="nav-btn" onclick="location.href='manager.html'" style="margin-top:auto; color:var(--red)">↩️ رجوع للمدير</button>
    </div>

    <div class="main-content">
        <div id="sales-section" class="section">
            <div class="stats-grid">
                <div class="stat-card"><h3>إجمالي المبيعات</h3><p id="total-amount">0 ج.م</p></div>
                <div class="stat-card"><h3>كاش 💵</h3><p id="total-cash">0 ج.م</p></div>
                <div class="stat-card"><h3>فيزا 💳</h3><p id="total-visa">0 ج.م</p></div>
                <div class="stat-card" style="border-color: var(--red);"><h3>المرتجعات ↩️</h3><p id="total-returns" style="color:var(--red)">0 ج.م</p></div>
            </div>

            <div class="filter-bar">
                <input type="date" id="sale-from"> 
                <span>إلى</span> 
                <input type="date" id="sale-to">
                <button class="export-btn" onclick="loadSalesReport()" style="background: var(--green);">تحديث البيانات</button>
                <input type="text" id="search-invoice" placeholder="بحث برقم الفاتورة..." oninput="loadSalesReport()" style="margin-right: auto;">
                <button class="export-btn" onclick="askExport('sales-table', 'تقرير_العمليات')">تحميل التقرير</button>
            </div>
            
            <div class="table-container">
                <table id="sales-table">
                    <thead><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>النوع</th><th>الوسيلة</th><th>البائع</th><th>المبلغ</th><th>إجراء</th></tr></thead>
                    <tbody id="sales-body"></tbody>
                </table>
            </div>
        </div>

        <div id="performance-section" class="section" style="display:none">
            <div class="filter-bar">
                <input type="date" id="perf-from"> <span>إلى</span> <input type="date" id="perf-to">
                <select id="user-select"><option value="all">كل الموظفين</option></select>
                <button class="export-btn" onclick="loadPerformanceReport()">عرض النتائج</button>
            </div>
            <div class="table-container">
                <table id="performance-table">
                    <thead><tr><th>الموظف</th><th>عدد العمليات</th><th>إجمالي المبيعات</th></tr></thead>
                    <tbody id="performance-body"></tbody>
                    <tfoot id="perf-footer" style="background: rgba(0,242,254,0.1); font-weight: bold; color: var(--accent);"></tfoot>
                </table>
            </div>
        </div>

        <div id="suppliers-section" class="section" style="display:none">
            <div class="filter-bar">
                <button class="export-btn" onclick="openSupModal()" style="background: var(--green);">+ إضافة فاتورة مورد</button>
                <button class="export-btn" onclick="loadSuppliersReport()">تحديث البيانات</button>
            </div>
            <div class="table-container">
                <table id="suppliers-table">
                    <thead><tr><th>المورد</th><th>إجمالي المسحوبات</th><th>المبلغ المدفوع</th><th>الديون المتبقية</th><th>إجراءات</th></tr></thead>
                    <tbody id="suppliers-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');
        let currentSalesData = []; 
        let currentExportTable = '';
        let currentExportName = '';

        async function init() {
            if(!storeKey) return location.href='index.html';
            loadUsersList();
            loadSalesReport();
        }

        async function loadUsersList() {
            const { data } = await _supabase.from('users').select('username').eq('store_key', storeKey);
            const select = document.getElementById('user-select');
            data?.forEach(u => select.innerHTML += `<option value="${u.username}">${u.username}</option>`);
        }

        async function loadSalesReport() {
            const from = document.getElementById('sale-from').value;
            const to = document.getElementById('sale-to').value;
            const search = document.getElementById('search-invoice').value;

            let query = _supabase.from('sales').select('*').eq('store_key', storeKey).order('created_at', {ascending: false});
            if(from) query = query.gte('created_at', from + 'T00:00:00');
            if(to) query = query.lte('created_at', to + 'T23:59:59');

            const { data: sales, error } = await query;
            if(error) return console.error(error);

            currentSalesData = sales;
            const body = document.getElementById('sales-body');
            body.innerHTML = '';

            let stats = { total: 0, cash: 0, visa: 0, returns: 0 };

            sales?.filter(s => s.id.toString().includes(search)).forEach(s => {
                // إصلاح مشكلة المرتجعات بقراءة صحيحة
                const isRet = (s.type || '').trim().toLowerCase() === 'return';
                
                if(isRet) {
                    stats.returns += s.total_amount;
                } else {
                    stats.total += s.total_amount;
                    if(s.payment_method === 'visa') stats.visa += s.total_amount;
                    else stats.cash += s.total_amount;
                }

                const row = document.createElement('tr');
                row.className = 'sale-row';
                row.innerHTML = `
                    <td onclick="showInvoiceDetails(${s.id})" style="color:var(--accent); font-weight:bold; cursor:pointer;">#${s.id.toString().slice(-6)}</td>
                    <td>${new Date(s.created_at).toLocaleDateString('ar-EG')}</td>
                    <td><span class="badge ${isRet ? 'badge-return' : 'badge-sale'}">${isRet ? 'مرتجع' : 'بيع'}</span></td>
                    <td>${s.payment_method === 'visa' ? 'فيزا 💳' : 'كاش 💵'}</td>
                    <td>${s.seller_name}</td>
                    <td style="font-weight:bold">${s.total_amount.toLocaleString()} ج.م</td>
                    <td><button class="btn-action" ${isRet ? 'disabled style="opacity:0.5"' : ''} onclick="processReturn(${s.id})">إرجاع</button></td>
                `;
                body.appendChild(row);
            });

            document.getElementById('total-amount').innerText = stats.total.toLocaleString() + " ج.م";
            document.getElementById('total-cash').innerText = stats.cash.toLocaleString() + " ج.م";
            document.getElementById('total-visa').innerText = stats.visa.toLocaleString() + " ج.م";
            document.getElementById('total-returns').innerText = stats.returns.toLocaleString() + " ج.م";
        }

        // تفاصيل الفاتورة - حل مشكلة القراءة
        function showInvoiceDetails(saleId) {
            const sale = currentSalesData.find(s => s.id === saleId);
            if(!sale) return;

            let items = [];
            try {
                items = typeof sale.items === 'string' ? JSON.parse(sale.items) : sale.items;
            } catch(e) { items = []; }

            const info = document.getElementById('invoice-info');
            info.innerHTML = `
                <p><b>البائع:</b> ${sale.seller_name}</p>
                <p><b>التاريخ:</b> ${new Date(sale.created_at).toLocaleString('ar-EG')}</p>
                <p><b>وسيلة الدفع:</b> ${sale.payment_method === 'visa' ? 'فيزا' : 'كاش'}</p>
            `;

            const list = document.getElementById('items-list');
            list.innerHTML = items.map(item => `
                <div class="details-item">
                    <span>${item.product_name || 'منتج'} (x${item.qty || 1})</span>
                    <span>${((item.price || 0) * (item.qty || 1)).toLocaleString()} ج.م</span>
                </div>
            `).join('');

            document.getElementById('invoice-total').innerText = "الإجمالي: " + sale.total_amount.toLocaleString() + " ج.م";
            document.getElementById('details-modal').style.display = 'flex';
        }

        // إرجاع الفاتورة للمخزن 
        async function processReturn(saleId) {
            if(!confirm("هل أنت متأكد من الإرجاع؟ سيتم إعادة المنتجات للمخزن وتحديث التقارير.")) return;

            const sale = currentSalesData.find(s => s.id === saleId);
            if(!sale) return;

            let items = [];
            try {
                items = typeof sale.items === 'string' ? JSON.parse(sale.items) : sale.items;
            } catch(e) { items = []; }

            try {
                // 1. تحديث حالة الفاتورة
                await _supabase.from('sales').update({ type: 'return' }).eq('id', saleId);

                // 2. إعادة المنتجات للمخزن
                for (let item of items) {
                    if(!item.id) continue;
                    const { data: product } = await _supabase.from('products').select('stock').eq('id', item.id).single();
                    if(product) {
                        const newStock = (parseFloat(product.stock) || 0) + parseFloat(item.qty || 0);
                        await _supabase.from('products').update({ stock: newStock }).eq('id', item.id);
                    }
                }

                alert("✅ تم الإرجاع بنجاح وإعادة المنتجات للمخزن");
                loadSalesReport();
            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء الإرجاع، يرجى المحاولة مرة أخرى.");
            }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // نظام بوب-أب التحميل
        function askExport(tableId, name) {
            currentExportTable = tableId;
            currentExportName = name;
            document.getElementById('export-modal').style.display = 'flex';
        }

        function processExport(type) {
            closeModal('export-modal');
            const table = document.getElementById(currentExportTable);
            if(type === 'excel') {
                const wb = XLSX.utils.table_to_book(table);
                XLSX.writeFile(wb, `${currentExportName}_${new Date().toLocaleDateString()}.xlsx`);
            } else {
                const opt = { margin: 10, filename: `${currentExportName}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, backgroundColor: '#111' }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
                html2pdf().set(opt).from(table).save();
            }
        }

        // --- بقية الأكواد بدون تغيير ---
        async function loadPerformanceReport() {
            const from = document.getElementById('perf-from').value;
            const to = document.getElementById('perf-to').value;
            const user = document.getElementById('user-select').value;
            let query = _supabase.from('sales').select('*').eq('store_key', storeKey).eq('type', 'sale');
            if(from) query = query.gte('created_at', from);
            if(to) query = query.lte('created_at', to + 'T23:59:59');
            const { data: sales } = await query;
            const body = document.getElementById('performance-body');
            body.innerHTML = '';
            let grandTotalSales = 0, grandTotalOps = 0;
            const usersToTrack = user === 'all' ? Array.from(document.getElementById('user-select').options).map(o => o.value).filter(v => v !== 'all') : [user];
            usersToTrack.forEach(uname => {
                const uSales = sales?.filter(s => s.seller_name === uname) || [];
                const total = uSales.reduce((sum, s) => sum + s.total_amount, 0);
                grandTotalSales += total; grandTotalOps += uSales.length;
                body.innerHTML += `<tr><td>${uname}</td><td>${uSales.length}</td><td style="color:var(--accent); font-weight:bold">${total.toLocaleString()} ج.م</td></tr>`;
            });
            document.getElementById('perf-footer').innerHTML = `<tr><td>الإجمالي العام</td><td>${grandTotalOps} عملية</td><td>${grandTotalSales.toLocaleString()} ج.م</td></tr>`;
        }

        async function loadSuppliersReport() {
            const { data: suppliers } = await _supabase.from('suppliers').select('*').eq('store_key', storeKey);
            const body = document.getElementById('suppliers-body');
            body.innerHTML = '';
            suppliers?.forEach(sup => {
                const debt = (sup.total_amount || 0) - (sup.paid_amount || 0);
                body.innerHTML += `
                    <tr>
                        <td>${sup.supplier_name}</td>
                        <td>${(sup.total_amount || 0).toLocaleString()} ج.م</td>
                        <td>${(sup.paid_amount || 0).toLocaleString()} ج.م</td>
                        <td style="color:${debt > 0 ? 'var(--red)' : 'var(--green)'}; font-weight:bold">${debt.toLocaleString()} ج.م</td>
                        <td>
                            <button class="btn-action" style="background:var(--orange);" onclick='editSupplier(${JSON.stringify(sup)})'>تعديل</button>
                            <button class="btn-action" onclick="deleteSupplier(${sup.id})">حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        function openSupModal() {
            document.getElementById('modal-title').innerText = "إضافة مورد جديد";
            document.getElementById('sup-id').value = "";
            document.getElementById('sup-name').value = "";
            document.getElementById('sup-total').value = "";
            document.getElementById('sup-paid').value = "";
            document.getElementById('supplier-modal').style.display = 'flex';
        }

        async function saveSupplier() {
            const id = document.getElementById('sup-id').value;
            const data = {
                supplier_name: document.getElementById('sup-name').value,
                total_amount: parseFloat(document.getElementById('sup-total').value) || 0,
                paid_amount: parseFloat(document.getElementById('sup-paid').value) || 0,
                store_key: storeKey
            };
            
            try {
                if(id) {
                    await _supabase.from('suppliers').update(data).eq('id', id);
                } else {
                    const { error } = await _supabase.from('suppliers').insert([data]);
                    if (error) {
                        alert("حدث خطأ أثناء الإضافة. تأكد من إعدادات قاعدة البيانات.");
                        console.error(error);
                        return;
                    }
                }
                closeModal('supplier-modal');
                loadSuppliersReport();
            } catch(e) {
                console.error(e);
            }
        }

        function editSupplier(sup) {
            openSupModal();
            document.getElementById('modal-title').innerText = "تعديل بيانات المورد";
            document.getElementById('sup-id').value = sup.id;
            document.getElementById('sup-name').value = sup.supplier_name;
            document.getElementById('sup-total').value = sup.total_amount;
            document.getElementById('sup-paid').value = sup.paid_amount;
        }

        async function deleteSupplier(id) {
            if(confirm("هل أنت متأكد من حذف هذا المورد؟")) {
                await _supabase.from('suppliers').delete().eq('id', id);
                loadSuppliersReport();
            }
        }

        function showSection(sec, btn) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(sec + '-section').style.display = 'block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(sec === 'suppliers') loadSuppliersReport();
        }

        init();
    </script>
</body>
</html>
