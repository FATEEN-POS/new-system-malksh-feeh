<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Fateen OS | Reports</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #050505; --card: #111111; --accent: #00f2fe; --white: #ffffff; --gray: #222; --red: #ff4d4d; --green: #00ff88; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background: var(--bg); color: var(--white); margin: 0; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { background: var(--gray); color: #fff; text-decoration: none; padding: 8px 20px; border-radius: 10px; font-size: 14px; }
        
        .filters { display: flex; gap: 15px; background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid var(--gray); margin-bottom: 25px; align-items: center; }
        input[type="date"] { background: #000; border: 1px solid var(--gray); color: #fff; padding: 8px; border-radius: 8px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--gray); text-align: center; }
        .stat-card h3 { font-size: 14px; color: #888; margin: 0; }
        .stat-card .value { font-size: 24px; font-weight: bold; margin-top: 10px; display: block; }

        .charts-section { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .report-box { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--gray); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: right; color: #555; padding: 10px; border-bottom: 1px solid var(--gray); font-size: 13px; }
        td { padding: 12px 10px; border-bottom: 1px solid #1a1a1a; font-size: 14px; }
        
        .best-seller-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1a1a1a; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 تقارير النظام التحليلية</h1>
        <a href="manager.html" class="back-btn">العودة للوحة المدير</a>
    </div>

    <div class="filters">
        <span>الفترة من:</span>
        <input type="date" id="date-from">
        <span>إلى:</span>
        <input type="date" id="date-to">
        <button onclick="fetchReports()" style="background:var(--accent); color:#000; border:none; padding:8px 20px; border-radius:8px; cursor:pointer; font-weight:bold;">تحديث البيانات</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>إجمالي المبيعات</h3>
            <span class="value" id="total-sales" style="color:var(--green)">0.00</span>
        </div>
        <div class="stat-card">
            <h3>إجمالي المرتجعات</h3>
            <span class="value" id="total-returns" style="color:var(--red)">0.00</span>
        </div>
        <div class="stat-card">
            <h3>مدفوعات كاش</h3>
            <span class="value" id="total-cash">0.00</span>
        </div>
        <div class="stat-card">
            <h3>مدفوعات فيزا</h3>
            <span class="value" id="total-visa">0.00</span>
        </div>
    </div>

    <div class="charts-section">
        <div class="report-box">
            <h3 style="margin:0;">📝 تفاصيل العمليات خلال الفترة</h3>
            <table>
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>النوع</th>
                        <th>القيمة</th>
                        <th>الوسيلة</th>
                    </tr>
                </thead>
                <tbody id="reports-table"></tbody>
            </table>
        </div>

        <div class="report-box">
            <h3 style="margin:0;">🔥 الأكثر مبيعاً</h3>
            <div id="best-sellers" style="margin-top:20px;">
                </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');

        // تعيين تاريخ اليوم تلقائياً
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date-from').value = today;
        document.getElementById('date-to').value = today;

        async function fetchReports() {
            const from = document.getElementById('date-from').value;
            const to = document.getElementById('date-to').value + " T23:59:59";

            const { data: sales, error } = await _supabase.from('sales')
                .select('*')
                .eq('store_key', storeKey)
                .gte('created_at', from)
                .lte('created_at', to)
                .order('created_at', { ascending: false });

            if(error) return;

            let totalSales = 0, totalReturns = 0, cash = 0, visa = 0;
            let productCounts = {};
            const tableBody = document.getElementById('reports-table');
            tableBody.innerHTML = '';

            sales.forEach(s => {
                if(s.type === 'sale') {
                    totalSales += s.total_amount;
                    if(s.payment_method === 'كاش') cash += s.total_amount; else visa += s.total_amount;
                    
                    // حساب الأكثر مبيعاً
                    s.items.forEach(item => {
                        productCounts[item.product_name] = (productCounts[item.product_name] || 0) + item.qty;
                    });
                } else {
                    totalReturns += s.total_amount;
                }

                tableBody.innerHTML += `
                    <tr>
                        <td>${new Date(s.created_at).toLocaleDateString('ar-EG')}</td>
                        <td style="color:${s.type === 'sale' ? 'var(--green)' : 'var(--red)'}">${s.type === 'sale' ? 'بيعة' : 'مرتجع'}</td>
                        <td>${s.total_amount}</td>
                        <td>${s.payment_method}</td>
                    </tr>
                `;
            });

            // تحديث البطاقات
            document.getElementById('total-sales').innerText = totalSales.toFixed(2) + " ج.م";
            document.getElementById('total-returns').innerText = totalReturns.toFixed(2) + " ج.م";
            document.getElementById('total-cash').innerText = cash.toFixed(2) + " ج.م";
            document.getElementById('total-visa').innerText = visa.toFixed(2) + " ج.م";

            // عرض الأكثر مبيعاً
            const bestSellersDiv = document.getElementById('best-sellers');
            const sortedProducts = Object.entries(productCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);
            bestSellersDiv.innerHTML = sortedProducts.map(p => `
                <div class="best-seller-item">
                    <span>${p[0]}</span>
                    <span style="color:var(--accent)">${p[1]} قطعة</span>
                </div>
            `).join('');
        }

        fetchReports();
    </script>
</body>
</html>
