<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مركز التقارير - Fateen OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #050505; --card: #111; --accent: #00f2fe; --gray: #222; --red: #ff4d4d; --green: #00ff88; }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: var(--card); border-left: 1px solid var(--gray); padding: 20px; }
        .nav-btn { background: none; border: 1px solid var(--gray); color: #888; padding: 12px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; text-align: right; width: 100%; }
        .nav-btn.active { border-color: var(--accent); color: #fff; background: rgba(0, 242, 254, 0.05); }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .stat-box { background: var(--card); border: 1px solid var(--gray); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 15px; overflow: hidden; }
        th, td { padding: 15px; border-bottom: 1px solid var(--gray); text-align: right; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--accent); width: 450px; }
        .btn-red { background: var(--red); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        .badge { padding: 4px 8px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color:var(--accent); text-align:center;">FATEEN OS</h2>
        <button class="nav-btn active">📊 تقارير المبيعات</button>
        <button class="nav-btn" onclick="location.href='manager.html'">الخروج</button>
    </div>

    <div class="main-content">
        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
            <input type="date" id="report-date" style="background:#000; color:#fff; border:1px solid var(--gray); padding:10px; border-radius:10px;">
            <button onclick="loadSales()" style="background:var(--accent); color:#000; border:none; padding:10px 20px; border-radius:10px; font-weight:bold; cursor:pointer;">تحديث البيانات</button>
        </div>

        <div id="stats-bar" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px;">
            <div class="stat-box"><h4>إجمالي البيع</h4><p id="total-sale" style="color:var(--green); font-size:24px;">0</p></div>
            <div class="stat-box"><h4>المرتجعات</h4><p id="total-return" style="color:var(--red); font-size:24px;">0</p></div>
            <div class="stat-box"><h4>صافي الكاش</h4><p id="total-net" style="color:var(--accent); font-size:24px;">0</p></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>رقم الفاتورة</th>
                    <th>الوقت</th>
                    <th>البائع</th>
                    <th>المبلغ</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="sales-body"></tbody>
        </table>
    </div>

    <div id="invoiceModal" class="modal">
        <div class="modal-content">
            <div id="modal-data"></div>
            <div id="return-zone"></div>
            <button onclick="document.getElementById('invoiceModal').style.display='none'" style="width:100%; margin-top:10px; background:none; color:#888; border:none; cursor:pointer;">إغلاق</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xyvxowlbvuqbggkslwqr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5dnhvd2xidnVxYmdna3Nsd3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDY3NzksImV4cCI6MjA4NjY4Mjc3OX0.h48-mCH2jR5Edsi2zZogbTDE-HNNfhAlQpKp9oJB_Bo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const storeKey = sessionStorage.getItem('store_key');

        document.getElementById('report-date').value = new Date().toISOString().split('T')[0];

        async function loadSales() {
            const date = document.getElementById('report-date').value;
            const { data: sales, error } = await _supabase.from('sales')
                .select('*')
                .eq('store_key', storeKey)
                .gte('created_at', date + 'T00:00:00')
                .lte('created_at', date + 'T23:59:59')
                .order('created_at', {ascending: false});

            if(error) return alert("خطأ في التحميل");

            let total = 0, returns = 0;
            const body = document.getElementById('sales-body');
            body.innerHTML = '';

            sales.forEach(s => {
                const isRet = s.type === 'return';
                const amt = parseFloat(s.total_amount) || 0;
                if(isRet) returns += amt; else total += amt;

                const row = document.createElement('tr');
                row.onclick = () => showInvoice(s);
                row.innerHTML = `
                    <td>#${s.id.toString().slice(-6)}</td>
                    <td>${new Date(s.created_at).toLocaleTimeString('ar-EG')}</td>
                    <td>${s.seller_name}</td>
                    <td>${amt} ج.م</td>
                    <td><span class="badge" style="background:${isRet ? 'var(--red)' : 'var(--green)'}">${isRet ? 'مرتجع' : 'تم البيع'}</span></td>
                `;
                body.appendChild(row);
            });

            document.getElementById('total-sale').innerText = total + " ج.م";
            document.getElementById('total-return').innerText = returns + " ج.م";
            document.getElementById('total-net').innerText = (total - returns) + " ج.م";
        }

        function showInvoice(sale) {
            const modal = document.getElementById('invoiceModal');
            const dataZone = document.getElementById('modal-data');
            const returnZone = document.getElementById('return-zone');

            dataZone.innerHTML = `
                <h3 style="text-align:center;">فاتورة #${sale.id.toString().slice(-6)}</h3>
                <hr style="border:0; border-top:1px solid var(--gray)">
                <div style="margin:20px 0;">
                    ${sale.items.map(i => `<div style="display:flex; justify-content:space-between"><span>${i.product_name} x ${i.qty}</span><span>${i.price * i.qty} ج.م</span></div>`).join('')}
                </div>
                <h2 style="text-align:center; color:var(--accent)">${sale.total_amount} ج.م</h2>
                <p style="font-size:12px; color:#888; text-align:center">طريقة الدفع: ${sale.payment_method}</p>
            `;

            if(sale.type !== 'return') {
                returnZone.innerHTML = `<button class="btn-red" onclick="doReturn('${sale.id}')">إرجاع الفاتورة بالكامل وإعادة للمخزن</button>`;
            } else {
                returnZone.innerHTML = `<p style="color:var(--red); text-align:center; font-weight:bold;">هذه الفاتورة مرتجعة بالفعل</p>`;
            }

            modal.style.display = 'flex';
        }

        async function doReturn(id) {
            if(!confirm("هل أنت متأكد؟ سيتم إضافة الأصناف للمخزن مرة أخرى.")) return;

            // 1. نجيب بيانات الفاتورة عشان نعرف الأصناف
            const { data: sale } = await _supabase.from('sales').select('*').eq('id', id).single();
            
            // 2. نحول حالة الفاتورة لمرتجع
            const { error: updErr } = await _supabase.from('sales').update({ type: 'return' }).eq('id', id);
            
            if(updErr) {
                alert("فشل تحديث الفاتورة: " + updErr.message);
                return;
            }

            // 3. نرجع الكميات للمخزن
            for(let item of sale.items) {
                const { data: p } = await _supabase.from('products').select('stock').eq('id', item.id).single();
                if(p) {
                    await _supabase.from('products').update({ stock: (Number(p.stock) + Number(item.qty)) }).eq('id', item.id);
                }
            }

            alert("✅ تم الإرجاع بنجاح وتحديث المخزون");
            document.getElementById('invoiceModal').style.display = 'none';
            loadSales();
        }

        loadSales();
    </script>
</body>
</html>
